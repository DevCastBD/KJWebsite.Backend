openapi: "3.1.1"
info:
  title: "KJWebsite Backend API"
  version: "1.0.0"
  description: "Public and admin API contract for KJWebsite microservices via API Gateway. Generated from the development service OpenAPI documents."
servers:
  -
    url: "http://localhost:7000"
    description: "Local API Gateway"
paths:
  /health:
    get:
      tags:
        - "System"
      summary: "Gateway health check"
      operationId: "GatewayHealth"
      responses:
        "200":
          description: "OK"
  /api/v1/content/projects:
    get:
      tags:
        - "Content"
      summary: "List projects (paginated)"
      description: "Returns \u0060{ items, total, limit, offset, lang }\u0060. \u0060lang\u0060: en/bn (default en). \u0060status\u0060: active/all (default active). \u0060limit\u0060: 1\u2013100 (default 20). \u0060offset\u0060: default 0. ETag \u002B Cache-Control are set."
      operationId: "GetProjects"
      parameters:
        -
          name: "lang"
          in: "query"
          schema:
            type: "string"
        -
          name: "status"
          in: "query"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  "/api/v1/content/projects/{id}":
    get:
      tags:
        - "Content"
      summary: "Get project by ID"
      description: "Returns a single project by slug ID in the requested language (\u0060lang\u0060: en/bn, default en)."
      operationId: "GetProjectById"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "lang"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/content/news:
    get:
      tags:
        - "Content"
      summary: "List news articles (paginated)"
      description: "Returns \u0060{ items, total, limit, offset, lang }\u0060. \u0060lang\u0060: en/bn (default en). \u0060limit\u0060: 1\u2013100 (default 20). \u0060offset\u0060: default 0. ETag \u002B Cache-Control are set."
      operationId: "GetNews"
      parameters:
        -
          name: "lang"
          in: "query"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  "/api/v1/content/news/{id}":
    get:
      tags:
        - "Content"
      summary: "Get news article by ID"
      description: "Returns a single news article by slug ID in the requested language (\u0060lang\u0060: en/bn, default en)."
      operationId: "GetNewsById"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "lang"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/content/bootstrap:
    get:
      tags:
        - "Content"
      summary: "Cold-start bundle"
      description: "Returns \u0060{ projects, news, settings, lang }\u0060 in one call for the SPA\u0027s first render (up to 100 active projects and 100 news items). ETag \u002B Cache-Control are set."
      operationId: "GetContentBootstrap"
      parameters:
        -
          name: "lang"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/content/projects:
    get:
      tags:
        - "Admin \u2014 Content"
      summary: "List projects with all translations"
      description: "Returns every translation of every project, grouped per slug. Requires the matching \u0060content.*\u0060 permission."
      operationId: "ListAdminProjects"
      parameters:
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
    post:
      tags:
        - "Admin \u2014 Content"
      summary: "Create or replace a project"
      description: "Creates a project with all provided language translations. Replaces any existing project with the same slug. Requires the matching \u0060content.*\u0060 permission."
      operationId: "CreateProject"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpsertRequest"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/content/projects/{id}":
    get:
      tags:
        - "Admin \u2014 Content"
      summary: "Get a project with all translations"
      description: "Requires the \u0060content.view\u0060 permission."
      operationId: "GetAdminProject"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
    put:
      tags:
        - "Admin \u2014 Content"
      summary: "Update a project"
      description: "Replaces all translations for the given project. Requires the matching \u0060content.*\u0060 permission."
      operationId: "UpdateProject"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpsertRequest"
        required: true
      responses:
        "200":
          description: "OK"
    delete:
      tags:
        - "Admin \u2014 Content"
      summary: "Delete a project"
      description: "Deletes all translations of the given project. Requires the matching \u0060content.*\u0060 permission."
      operationId: "DeleteProject"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/content/news:
    get:
      tags:
        - "Admin \u2014 Content"
      summary: "List news articles with all translations"
      description: "Returns every translation of every article, grouped per slug. Requires the matching \u0060content.*\u0060 permission."
      operationId: "ListAdminNews"
      parameters:
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
    post:
      tags:
        - "Admin \u2014 Content"
      summary: "Create or replace a news article"
      description: "Creates a news article with all provided language translations. Replaces any existing article with the same slug. Requires the matching \u0060content.*\u0060 permission."
      operationId: "CreateNews"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsUpsertRequest"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/content/news/{id}":
    get:
      tags:
        - "Admin \u2014 Content"
      summary: "Get a news article with all translations"
      description: "Requires the \u0060content.view\u0060 permission."
      operationId: "GetAdminNews"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
    put:
      tags:
        - "Admin \u2014 Content"
      summary: "Update a news article"
      description: "Replaces all translations for the given news article. Requires the matching \u0060content.*\u0060 permission."
      operationId: "UpdateNews"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsUpsertRequest"
        required: true
      responses:
        "200":
          description: "OK"
    delete:
      tags:
        - "Admin \u2014 Content"
      summary: "Delete a news article"
      description: "Deletes all translations of the given news article. Requires the matching \u0060content.*\u0060 permission."
      operationId: "DeleteNews"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/cta/submissions:
    post:
      tags:
        - "CTA"
      summary: "Submit a CTA form"
      description: "Accepts a call-to-action form submission. Valid formName values: registration, contact, footer-contact, project-involved. Valid ctaType values: join, donate, partnership, get-involved, contact."
      operationId: "CreateCtaSubmission"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CtaSubmissionRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/auth/register:
    post:
      tags:
        - "Auth"
      summary: "Register a new user account"
      description: "Creates a new member account with a hashed password and sends an email-confirmation message. The requested role is ignored: new accounts are \u0060Member\u0060. Includes optional legacy profile fields (name, gender, address, etc.)."
      operationId: "Register"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyRegistrationRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/auth/login:
    post:
      tags:
        - "Auth"
      summary: "Login and receive tokens"
      description: "Authenticates a user and returns an \u0060access_token\u0060 (RS256 JWT, 15 min) and a \u0060refresh_token\u0060 (opaque, stored hashed, 30 days). Repeated failures lock the account (423). Unconfirmed emails are rejected (403) unless \u0060Identity:RequireConfirmedEmail\u0060 is off."
      operationId: "Login"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/auth/refresh:
    post:
      tags:
        - "Auth"
      summary: "Refresh an expired access token"
      description: "Rotates the refresh token and issues a new access token. The old refresh token is single-use; presenting it again ends the whole session."
      operationId: "RefreshToken"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/auth/logout:
    post:
      tags:
        - "Auth"
      summary: "Logout and revoke refresh token"
      description: "Ends the session the given refresh token belongs to. Returns 204 No Content on success."
      operationId: "Logout"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/auth/confirm-email:
    post:
      tags:
        - "Auth"
      summary: "Confirm an email address"
      description: "Confirms the address using the token from the confirmation email. Returns 204 on success."
      operationId: "ConfirmEmail"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmEmailRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/auth/resend-confirmation:
    post:
      tags:
        - "Auth"
      summary: "Resend the confirmation email"
      description: "Always returns 202, whether or not the account exists."
      operationId: "ResendConfirmation"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendConfirmationRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/auth/forgot-password:
    post:
      tags:
        - "Auth"
      summary: "Request a password-reset email"
      description: "Always returns 202, whether or not the account exists, so it cannot be used to discover accounts."
      operationId: "ForgotPassword"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/auth/reset-password:
    post:
      tags:
        - "Auth"
      summary: "Set a new password with a reset token"
      description: "Sets the password using the emailed token, lifts any lockout and revokes all refresh tokens. Returns 204 on success."
      operationId: "ResetPassword"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/auth/me:
    get:
      tags:
        - "Auth"
      summary: "Get the authenticated user\u0027s profile"
      description: "Returns the full profile of the currently authenticated user. Requires \u0060Authorization: Bearer \u003Caccess_token\u003E\u0060 obtained from the login endpoint."
      operationId: "GetCurrentUser"
      responses:
        "200":
          description: "OK"
  /.well-known/jwks.json:
    get:
      tags:
        - "System"
      summary: "Public signing keys"
      description: "The public keys that verify access tokens (JSON Web Key Set). Contains no secrets."
      operationId: "Jwks"
      responses:
        "200":
          description: "OK"
  /api/v1/auth/sessions:
    get:
      tags:
        - "Auth"
      summary: "List the signed-in user\u0027s active sessions"
      description: "One entry per device/session with a live refresh token. \u0060current\u0060 marks the session making the request."
      operationId: "ListSessions"
      responses:
        "200":
          description: "OK"
  "/api/v1/auth/sessions/{id}":
    delete:
      tags:
        - "Auth"
      summary: "End one of the user\u0027s sessions"
      description: "Revokes the session\u0027s refresh tokens. Another user\u0027s session id is reported as not found."
      operationId: "RevokeSession"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/auth/logout-all:
    post:
      tags:
        - "Auth"
      summary: "End every session of the signed-in user"
      description: "Revokes all refresh tokens for the user, on every device. Returns 204."
      operationId: "LogoutAll"
      responses:
        "200":
          description: "OK"
tags:
  -
    name: "System"
  -
    name: "Content"
  -
    name: "Admin \u2014 Content"
  -
    name: "CTA"
  -
    name: "Auth"
components:
  schemas:
    NewsTranslationInput:
      required:
        - "lang"
        - "title"
        - "summary"
        - "content"
      type: "object"
      properties:
        lang:
          type: "string"
        title:
          type: "string"
        summary:
          type:
            - "null"
            - "string"
        content:
          type:
            - "null"
            - "array"
          items:
            type: "string"
    NewsUpsertRequest:
      required:
        - "slug"
        - "imageUrl"
        - "publishedAt"
        - "status"
        - "translations"
      type: "object"
      properties:
        slug:
          type: "string"
        imageUrl:
          type:
            - "null"
            - "string"
        publishedAt:
          type:
            - "null"
            - "string"
          format: "date-time"
        status:
          type: "string"
        translations:
          type: "array"
          items:
            $ref: "#/components/schemas/NewsTranslationInput"
    ProjectTranslationInput:
      required:
        - "lang"
        - "title"
        - "shortTitle"
        - "shortDescription"
        - "fullDescription"
      type: "object"
      properties:
        lang:
          type: "string"
        title:
          type: "string"
        shortTitle:
          type:
            - "null"
            - "string"
        shortDescription:
          type:
            - "null"
            - "string"
        fullDescription:
          type:
            - "null"
            - "string"
    ProjectUpsertRequest:
      required:
        - "slug"
        - "imageUrl"
        - "category"
        - "year"
        - "status"
        - "icon"
        - "translations"
      type: "object"
      properties:
        slug:
          type: "string"
        imageUrl:
          type:
            - "null"
            - "string"
        category:
          type:
            - "null"
            - "string"
        year:
          type:
            - "null"
            - "string"
        status:
          type: "string"
        icon:
          type:
            - "null"
            - "string"
        translations:
          type: "array"
          items:
            $ref: "#/components/schemas/ProjectTranslationInput"
    CtaSubmissionRequest:
      required:
        - "formName"
        - "ctaType"
        - "language"
        - "sourcePath"
        - "values"
        - "submittedAt"
      type: "object"
      properties:
        formName:
          type: "string"
        ctaType:
          type: "string"
        language:
          type: "string"
        sourcePath:
          type: "string"
        values:
          type: "object"
        submittedAt:
          type: "string"
          format: "date-time"
    ConfirmEmailRequest:
      required:
        - "userId"
        - "token"
      type: "object"
      properties:
        userId:
          type: "string"
        token:
          type: "string"
    ForgotPasswordRequest:
      required:
        - "email"
      type: "object"
      properties:
        email:
          type: "string"
    LegacyRegistrationRequest:
      required:
        - "email"
        - "password"
        - "firstName"
        - "lastName"
        - "gender"
        - "reasonForJoining"
        - "presentOrganization"
        - "volunteeingExperience"
        - "dateOfBirth"
        - "cityOfResidence"
        - "countryOfResidence"
        - "permanentAddress"
        - "mailingAddress"
        - "isMailingAddressSameAsPermanentAddress"
        - "bloodGroup"
        - "areasOfExpertise"
        - "highestDegree"
        - "disabilitiesIfAny"
        - "nationality"
        - "personalWebPage"
        - "socialMediaLink"
        - "roles"
      type: "object"
      properties:
        email:
          type: "string"
        password:
          type: "string"
        firstName:
          type:
            - "null"
            - "string"
        lastName:
          type:
            - "null"
            - "string"
        gender:
          type:
            - "null"
            - "string"
        reasonForJoining:
          type:
            - "null"
            - "string"
        presentOrganization:
          type:
            - "null"
            - "string"
        volunteeingExperience:
          type:
            - "null"
            - "string"
        dateOfBirth:
          type:
            - "null"
            - "string"
        cityOfResidence:
          type:
            - "null"
            - "string"
        countryOfResidence:
          type:
            - "null"
            - "string"
        permanentAddress:
          type:
            - "null"
            - "string"
        mailingAddress:
          type:
            - "null"
            - "string"
        isMailingAddressSameAsPermanentAddress:
          type:
            - "null"
            - "boolean"
        bloodGroup:
          type:
            - "null"
            - "string"
        areasOfExpertise:
          type:
            - "null"
            - "string"
        highestDegree:
          type:
            - "null"
            - "string"
        disabilitiesIfAny:
          type:
            - "null"
            - "string"
        nationality:
          type:
            - "null"
            - "string"
        personalWebPage:
          type:
            - "null"
            - "string"
        socialMediaLink:
          type:
            - "null"
            - "string"
        roles:
          type:
            - "null"
            - "string"
    LoginRequest:
      required:
        - "email"
        - "password"
      type: "object"
      properties:
        email:
          type: "string"
        password:
          type: "string"
    RefreshTokenRequest:
      required:
        - "refreshToken"
      type: "object"
      properties:
        refreshToken:
          type: "string"
    ResendConfirmationRequest:
      required:
        - "email"
      type: "object"
      properties:
        email:
          type: "string"
    ResetPasswordRequest:
      required:
        - "email"
        - "token"
        - "newPassword"
      type: "object"
      properties:
        email:
          type: "string"
        token:
          type: "string"
        newPassword:
          type: "string"
