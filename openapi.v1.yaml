  "/api/v1/content/news/{id}":
    get:
      tags:
        - "Content"
      summary: "Get news article by ID"
      description: "Returns a single news article by slug ID in the requested language (\u0060lang\u0060: en/bn, default en)."
      operationId: "GetNewsById"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "lang"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
