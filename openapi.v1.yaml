          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsItem"
        "304":
          description: "Not Modified"
        "400":
          description: "Validation failed. \u0060errors\u0060 lists each field."
          content:
            "application/problem\u002Bjson":
