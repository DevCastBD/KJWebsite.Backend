components:
  schemas:
    ContentTranslationInput:
      required:
        - "lang"
        - "title"
        - "summary"
        - "body"
        - "attributes"
      type: "object"
      properties:
        lang:
          type: "string"
        title:
          type: "string"
        summary:
          type:
            - "null"
            - "string"
        body:
          type:
            - "null"
            - "string"
        attributes:
          type:
            - "null"
            - "object"
    ContentUpsertRequest:
      required:
        - "slug"
        - "status"
        - "imageUrl"
        - "publishedAt"
        - "sortOrder"
        - "translations"
        - "tags"
        - "related"
      type: "object"
      properties:
        slug:
          type: "string"
        status:
          type: "string"
        imageUrl:
          type:
            - "null"
            - "string"
        publishedAt:
          type:
            - "null"
            - "string"
          format: "date-time"
        sortOrder:
          pattern: "^-?(?:0|[1-9]\\d*)$"
          type:
            - "null"
            - "integer"
            - "string"
          format: "int32"
        translations:
          type: "array"
          items:
            $ref: "#/components/schemas/ContentTranslationInput"
        tags:
          type:
            - "null"
            - "array"
          items:
            type: "string"
        related:
          type:
            - "null"
            - "array"
          items:
            $ref: "#/components/schemas/RelatedRef"
    FlagWrite:
      required:
        - "enabled"
        - "description"
      type: "object"
      properties:
        enabled:
          type: "boolean"
        description:
          type:
            - "null"
            - "string"
    JsonElement: {}
    NewsTranslationInput:
      required:
        - "lang"
        - "title"
        - "summary"
        - "content"
      type: "object"
      properties:
        lang:
          type: "string"
        title:
          type: "string"
        summary:
          type:
            - "null"
            - "string"
        content:
          type:
            - "null"
            - "array"
          items:
            type: "string"
        date:
          type:
            - "null"
            - "string"
        tags:
          type:
            - "null"
            - "array"
          items:
            type: "string"
    NewsUpsertRequest:
      required:
        - "slug"
        - "imageUrl"
        - "publishedAt"
        - "status"
        - "translations"
      type: "object"
      properties:
        slug:
          type: "string"
        imageUrl:
          type:
            - "null"
            - "string"
        publishedAt:
          type:
            - "null"
            - "string"
          format: "date-time"
        status:
          type: "string"
        translations:
          type: "array"
