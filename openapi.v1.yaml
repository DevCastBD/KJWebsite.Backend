openapi: "3.1.1"
info:
  title: "KJWebsite Backend API"
  version: "1.0.0"
  description: "Public and admin API contract for KJWebsite microservices via API Gateway. Generated from the development service OpenAPI documents."
servers:
  -
    url: "http://localhost:7000"
    description: "Local API Gateway"
paths:
  /health:
    get:
      tags:
        - "System"
      summary: "Gateway health check"
      operationId: "GatewayHealth"
      responses:
        "200":
          description: "OK"
  /api/v1/content/projects:
    get:
      tags:
        - "Content"
      summary: "List projects"
      description: "Returns projects filtered by language (\u0060lang\u0060: en/bn, default en) and status (\u0060status\u0060: active/all, default active)."
      operationId: "GetProjects"
      parameters:
        -
          name: "lang"
          in: "query"
          schema:
            type: "string"
        -
          name: "status"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/content/projects/{id}":
    get:
      tags:
        - "Content"
      summary: "Get project by ID"
      description: "Returns a single project by slug ID in the requested language (\u0060lang\u0060: en/bn, default en)."
      operationId: "GetProjectById"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "lang"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/content/news:
    get:
      tags:
        - "Content"
      summary: "List news articles (paginated)"
      description: "Returns paginated news articles. \u0060lang\u0060: en/bn (default en). \u0060limit\u0060: 1\u2013100 (default 20). \u0060offset\u0060: default 0."
      operationId: "GetNews"
      parameters:
        -
          name: "lang"
          in: "query"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  "/api/v1/content/news/{id}":
    get:
      tags:
        - "Content"
      summary: "Get news article by ID"
      description: "Returns a single news article by slug ID in the requested language (\u0060lang\u0060: en/bn, default en)."
      operationId: "GetNewsById"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "lang"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/content/projects:
    post:
      tags:
        - "Admin \u2014 Content"
      summary: "Create or replace a project"
      description: "Creates a project with all provided language translations. Replaces any existing project with the same slug. Requires \u0060Authorization: Bearer dev-admin-token\u0060."
      operationId: "CreateProject"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpsertRequest"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/content/projects/{id}":
    put:
      tags:
        - "Admin \u2014 Content"
      summary: "Update a project"
      description: "Replaces all translations for the given project. Requires \u0060Authorization: Bearer dev-admin-token\u0060."
      operationId: "UpdateProject"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpsertRequest"
        required: true
      responses:
        "200":
          description: "OK"
    delete:
      tags:
        - "Admin \u2014 Content"
      summary: "Delete a project"
      description: "Deletes all translations of the given project. Requires \u0060Authorization: Bearer dev-admin-token\u0060."
      operationId: "DeleteProject"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/content/news:
    post:
      tags:
        - "Admin \u2014 Content"
      summary: "Create or replace a news article"
      description: "Creates a news article with all provided language translations. Replaces any existing article with the same slug. Requires \u0060Authorization: Bearer dev-admin-token\u0060."
      operationId: "CreateNews"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsUpsertRequest"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/content/news/{id}":
    put:
      tags:
        - "Admin \u2014 Content"
      summary: "Update a news article"
      description: "Replaces all translations for the given news article. Requires \u0060Authorization: Bearer dev-admin-token\u0060."
      operationId: "UpdateNews"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsUpsertRequest"
        required: true
      responses:
        "200":
          description: "OK"
    delete:
      tags:
        - "Admin \u2014 Content"
      summary: "Delete a news article"
      description: "Deletes all translations of the given news article. Requires \u0060Authorization: Bearer dev-admin-token\u0060."
      operationId: "DeleteNews"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/cta/submissions:
    post:
      tags:
        - "CTA"
      summary: "Submit a CTA form"
      description: "Accepts a call-to-action form submission. Valid formName values: registration, contact, footer-contact, project-involved. Valid ctaType values: join, donate, partnership, get-involved, contact."
      operationId: "CreateCtaSubmission"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CtaSubmissionRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/auth/register:
    post:
      tags:
        - "Auth"
      summary: "Register a new user account"
      description: "Creates a new user. Role defaults to \u0027editor\u0027. Includes optional legacy profile fields (name, gender, address, etc.)."
      operationId: "Register"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyRegistrationRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/auth/login:
    post:
      tags:
        - "Auth"
      summary: "Login and receive tokens"
      description: "Authenticates a user and returns an \u0060access_token\u0060 (in-memory, 15 min) and a \u0060refresh_token\u0060 (persisted, 30 days). Dev seed: \u0060admin@site.org\u0060 / \u0060admin123\u0060."
      operationId: "Login"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/auth/refresh:
    post:
      tags:
        - "Auth"
      summary: "Refresh an expired access token"
      description: "Rotates the refresh token and issues a new access token. The old refresh token is immediately revoked."
      operationId: "RefreshToken"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/auth/logout:
    post:
      tags:
        - "Auth"
      summary: "Logout and revoke refresh token"
      description: "Revokes the given refresh token. Returns 204 No Content on success."
      operationId: "Logout"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/auth/me:
    get:
      tags:
        - "Auth"
      summary: "Get the authenticated user\u0027s profile"
      description: "Returns the full profile of the currently authenticated user. Requires \u0060Authorization: Bearer \u003Caccess_token\u003E\u0060 obtained from the login endpoint."
      operationId: "GetCurrentUser"
      responses:
        "200":
          description: "OK"
tags:
  -
    name: "System"
  -
    name: "Content"
  -
    name: "Admin \u2014 Content"
  -
    name: "CTA"
  -
    name: "Auth"
components:
  schemas:
    NewsTranslationInput:
      required:
        - "lang"
        - "title"
        - "summary"
        - "content"
      type: "object"
      properties:
        lang:
          type: "string"
        title:
          type: "string"
        summary:
          type:
            - "null"
            - "string"
        content:
          type:
            - "null"
            - "array"
          items:
            type: "string"
    NewsUpsertRequest:
      required:
        - "slug"
        - "imageUrl"
        - "publishedAt"
        - "status"
        - "translations"
      type: "object"
      properties:
        slug:
          type: "string"
        imageUrl:
          type:
            - "null"
            - "string"
        publishedAt:
          type:
            - "null"
            - "string"
          format: "date-time"
        status:
          type: "string"
        translations:
          type: "array"
          items:
            $ref: "#/components/schemas/NewsTranslationInput"
    ProjectTranslationInput:
      required:
        - "lang"
        - "title"
        - "shortTitle"
        - "shortDescription"
        - "fullDescription"
      type: "object"
      properties:
        lang:
          type: "string"
        title:
          type: "string"
        shortTitle:
          type:
            - "null"
            - "string"
        shortDescription:
          type:
            - "null"
            - "string"
        fullDescription:
          type:
            - "null"
            - "string"
    ProjectUpsertRequest:
      required:
        - "slug"
        - "imageUrl"
        - "category"
        - "year"
        - "status"
        - "icon"
        - "translations"
      type: "object"
      properties:
        slug:
          type: "string"
        imageUrl:
          type:
            - "null"
            - "string"
        category:
          type:
            - "null"
            - "string"
        year:
          type:
            - "null"
            - "string"
        status:
          type: "string"
        icon:
          type:
            - "null"
            - "string"
        translations:
          type: "array"
          items:
            $ref: "#/components/schemas/ProjectTranslationInput"
    CtaSubmissionRequest:
      required:
        - "formName"
        - "ctaType"
        - "language"
        - "sourcePath"
        - "values"
        - "submittedAt"
      type: "object"
      properties:
        formName:
          type: "string"
        ctaType:
          type: "string"
        language:
          type: "string"
        sourcePath:
          type: "string"
        values:
          type: "object"
        submittedAt:
          type: "string"
          format: "date-time"
    LegacyRegistrationRequest:
      required:
        - "email"
        - "password"
        - "firstName"
        - "lastName"
        - "gender"
        - "reasonForJoining"
        - "presentOrganization"
        - "volunteeingExperience"
        - "dateOfBirth"
        - "cityOfResidence"
        - "countryOfResidence"
        - "permanentAddress"
        - "mailingAddress"
        - "isMailingAddressSameAsPermanentAddress"
        - "bloodGroup"
        - "areasOfExpertise"
        - "highestDegree"
        - "disabilitiesIfAny"
        - "nationality"
        - "personalWebPage"
        - "socialMediaLink"
        - "roles"
      type: "object"
      properties:
        email:
          type: "string"
        password:
          type: "string"
        firstName:
          type:
            - "null"
            - "string"
        lastName:
          type:
            - "null"
            - "string"
        gender:
          type:
            - "null"
            - "string"
        reasonForJoining:
          type:
            - "null"
            - "string"
        presentOrganization:
          type:
            - "null"
            - "string"
        volunteeingExperience:
          type:
            - "null"
            - "string"
        dateOfBirth:
          type:
            - "null"
            - "string"
        cityOfResidence:
          type:
            - "null"
            - "string"
        countryOfResidence:
          type:
            - "null"
            - "string"
        permanentAddress:
          type:
            - "null"
            - "string"
        mailingAddress:
          type:
            - "null"
            - "string"
        isMailingAddressSameAsPermanentAddress:
          type:
            - "null"
            - "boolean"
        bloodGroup:
          type:
            - "null"
            - "string"
        areasOfExpertise:
          type:
            - "null"
            - "string"
        highestDegree:
          type:
            - "null"
            - "string"
        disabilitiesIfAny:
          type:
            - "null"
            - "string"
        nationality:
          type:
            - "null"
            - "string"
        personalWebPage:
          type:
            - "null"
            - "string"
        socialMediaLink:
          type:
            - "null"
            - "string"
        roles:
          type:
            - "null"
            - "string"
    LoginRequest:
      required:
        - "email"
        - "password"
      type: "object"
      properties:
        email:
          type: "string"
        password:
          type: "string"
    RefreshTokenRequest:
      required:
        - "refreshToken"
      type: "object"
      properties:
        refreshToken:
          type: "string"
