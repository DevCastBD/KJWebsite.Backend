          name: "slug"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/content/redirects/resolve:
    get:
      tags:
        - "Content"
      summary: "Resolve an old path (legacy \u0060.html\u0060/\u0060.php\u0060, renamed slug) to its replacement"
      description: "Returns \u0060{ from, to, statusCode }\u0060 or 404. Paths are matched case-insensitively, without query string or trailing slash."
      operationId: "ResolveRedirect"
      parameters:
        -
          name: "path"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/content/redirects:
    get:
      tags:
        - "Admin \u2014 Content"
      summary: "List redirects"
      operationId: "ListRedirects"
      parameters:
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
    post:
      tags:
        - "Admin \u2014 Content"
      summary: "Add or replace a redirect (legacy URLs, language-prefix moves)"
      description: "Existing redirects that point at \u0060from\u0060 are retargeted, and chains are flattened; a loop is rejected."
      operationId: "CreateRedirect"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedirectCreateRequest"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/content/redirects/{id}":
    delete:
      tags:
        - "Admin \u2014 Content"
      summary: "Delete a redirect"
      operationId: "DeleteRedirect"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/content/settings:
    get:
      tags:
        - "Content"
      summary: "Site settings and runtime flags in one language"
      description: "Navigation, contact, social, footer, homepage section order, maintenance and the custom non-secret settings, each text already resolved to \u0060lang\u0060. Secret settings are never included. \u0060flags\u0060 are runtime feature flags, not the frontend\u0027s build-time VITE_ENABLE_* flags."
      operationId: "GetPublicSettings"
      parameters:
        -
          name: "lang"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/content/settings:
    get:
      tags:
        - "Admin \u2014 Site settings"
      summary: "List settings (secret values are hidden)"
      operationId: "ListSettings"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/content/settings/{key}":
    get:
      tags:
        - "Admin \u2014 Site settings"
      summary: "Get one setting with both languages"
      description: "The \u0060ETag\u0060 is the version to send back as \u0060If-Match\u0060. Secret values are returned here, to settings.view holders only."
      operationId: "GetSetting"
      parameters:
        -
          name: "key"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
    put:
      tags:
        - "Admin \u2014 Site settings"
      summary: "Create or replace a setting"
      description: "Catalog keys: navigation.main, navigation.footer, contact, social, footer.text, homepage.sections, maintenance; plus custom.\u003Cname\u003E (one bilingual text, optionally secret). Every visible text needs both bn and en or the save is a 400. Honours \u0060If-Match\u0060."
      operationId: "SetSetting"
      parameters:
        -
          name: "key"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingWrite"
        required: true
      responses:
        "200":
          description: "OK"
    delete:
      tags:
        - "Admin \u2014 Site settings"
      summary: "Delete a setting (the frontend falls back to its static value)"
      operationId: "DeleteSetting"
      parameters:
        -
          name: "key"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/content/flags:
    get:
      tags:
        - "Admin \u2014 Site settings"
      summary: "List runtime feature flags"
      operationId: "ListFlags"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/content/flags/{key}":
    put:
      tags:
        - "Admin \u2014 Site settings"
      summary: "Create or change a runtime feature flag"
      description: "Takes effect for the public site as soon as the cache is evicted (immediately). Runtime flags are separate from the frontend\u0027s build-time VITE_ENABLE_* capability flags."
      operationId: "SetFlag"
      parameters:
        -
          name: "key"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagWrite"
        required: true
      responses:
        "200":
          description: "OK"
    delete:
      tags:
        - "Admin \u2014 Site settings"
      summary: "Delete a runtime feature flag"
      operationId: "DeleteFlag"
      parameters:
        -
          name: "key"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/content/dashboard:
    get:
      tags:
        - "Admin \u2014 Back office"
      summary: "Back-office summary: what needs attention"
      description: "Item counts per type and status, the in-review queue, the next scheduled publications, translation gap totals, trash size and (with audit.view) the latest activity. Cached for 30 s (\u0060BackOffice:DashboardCacheSeconds\u0060), so it is cheap on every page view. Submissions and media widgets arrive with their modules."
      operationId: "GetDashboard"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/content/search:
    get:
      tags:
        - "Admin \u2014 Back office"
      summary: "Search items, tags, redirects and settings"
      description: "Substring match on slugs, titles and summaries in any language. Only kinds the caller may read are searched (\u0060searched\u0060 lists them); the rest are omitted, so a result never reveals a record the caller cannot open."
      operationId: "GlobalSearch"
      parameters:
        -
          name: "q"
          in: "query"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/content/bulk:
    post:
      tags:
        - "Admin \u2014 Back office"
      summary: "Apply one action to up to 100 items"
      description: "Actions: \u0060workflow:draft|in_review|scheduled|published|archived\u0060 (scheduled needs \u0060publishAt\u0060), \u0060delete\u0060, \u0060restore\u0060, \u0060tag-add\u0060, \u0060tag-remove\u0060 (with \u0060tag\u0060). Always 200: read \u0060results\u0060 for each item\u0027s \u0060ok\u0060 or \u0060failed\u0060 with a code. Each item is checked against the caller\u0027s permissions and audited like a single change, and a failure never stops the rest."
      operationId: "BulkAction"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/content/search:
    get:
      tags:
        - "Content"
      summary: "Search published content (Bengali-aware)"
      description: "Prefix match on every query term (AND), in the requested language, weighted title \u003E summary \u003E body. Bengali conjuncts and mixed bn/en queries are supported. Returns \u0060{ q, lang, items, total, limit, offset }\u0060; 503 SEARCH_UNAVAILABLE after \u0060Search:TimeoutMs\u0060 (default 2000)."
      operationId: "SearchContent"
      parameters:
        -
          name: "q"
          in: "query"
          schema:
            type: "string"
        -
          name: "lang"
          in: "query"
          schema:
            type: "string"
        -
          name: "type"
          in: "query"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  /sitemap.xml:
    get:
      tags:
        - "Content"
      summary: "Sitemap of published content (no drafts), with hreflang alternates"
      description: "Covers content items only (types from \u0060Site:SitemapTypes\u0060); the frontend keeps its own sitemap for static routes. Needs \u0060Site:BaseUrl\u0060."
      operationId: "GetSitemap"
      responses:
        "200":
          description: "OK"
  /feed.rss:
    get:
      tags:
        - "Content"
      summary: "RSS 2.0 feed of the newest published items, one language"
      description: "\u0060?lang=bn|en\u0060. Items without a translation in that language are left out (no fallback: a subscriber wants one language). Types from \u0060Site:FeedTypes\u0060 (default news)."
      operationId: "GetRssFeed"
      parameters:
        -
          name: "lang"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /feed.atom:
    get:
      tags:
        - "Content"
      summary: "Atom feed of the newest published items, one language"
      operationId: "GetAtomFeed"
      parameters:
        -
          name: "lang"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/content/og/{type}/{slug}":
    get:
      tags:
        - "Content"
      summary: "Open Graph metadata for one item, for the frontend to render"
      description: "\u0060title\u0060, \u0060description\u0060, canonical \u0060url\u0060, absolute \u0060image\u0060, \u0060type\u0060 (article/website), \u0060locale\u0060 (bn_BD/en_US) and alternates. Needs \u0060Site:BaseUrl\u0060."
      operationId: "GetOpenGraph"
      parameters:
        -
          name: "type"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "slug"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "lang"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/content/audit:
    get:
      tags:
        - "Admin \u2014 Audit log"
      summary: "Query the Content audit log"
      description: "Newest first. Filters: \u0060actor\u0060 (id or email), \u0060entity\u0060, \u0060entityId\u0060, \u0060action\u0060 (create/update/delete), \u0060requestId\u0060, \u0060from\u0060, \u0060to\u0060. Page with \u0060cursor\u0060 = the \u0060nextCursor\u0060 of the previous page. Requires \u0060audit.view\u0060; before/after hold personal data."
      operationId: "ListContentAuditLog"
      parameters:
        -
          name: "actor"
          in: "query"
          schema:
            type: "string"
        -
          name: "entity"
          in: "query"
          schema:
            type: "string"
        -
          name: "entityId"
          in: "query"
          schema:
            type: "string"
        -
          name: "action"
          in: "query"
          schema:
            type: "string"
        -
          name: "requestId"
          in: "query"
          schema:
            type: "string"
        -
          name: "from"
          in: "query"
          schema:
            type: "string"
            format: "date-time"
        -
          name: "to"
          in: "query"
          schema:
            type: "string"
            format: "date-time"
        -
          name: "cursor"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int64"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/content/audit/{id}":
    get:
      tags:
        - "Admin \u2014 Audit log"
      summary: "Get one Content audit event"
      operationId: "GetContentAuditEvent"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
  /api/v1/cta/submissions:
    post:
      tags:
        - "CTA"
      summary: "Submit a CTA form"
      description: "Accepts a call-to-action form submission. Valid formName values: registration, contact, footer-contact, project-involved. Valid ctaType values: join, donate, partnership, get-involved, contact."
      operationId: "CreateCtaSubmission"
      parameters:
        -
          name: "Idempotency-Key"
          in: "header"
          description: "Optional. A repeat with the same key and body returns the original response (header \u0060Idempotency-Replayed: true\u0060) and creates nothing new; the same key with a different body is 422; a repeat while the first is running is 409. Keys are remembered for 24 hours."
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CtaSubmissionRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/membership/applications:
    post:
      tags:
        - "Membership"
      summary: "Submit a membership application"
      description: "Accepts the full legacy application field set. Returns 409 INTAKE_CLOSED when recruitment seasons exist but none is open. Returns the application id and its public reference; attach the CV and photo afterwards with PUT /api/v1/membership/applications/{id}/attachments/{kind}."
      operationId: "CreateMembershipApplication"
      parameters:
        -
          name: "Idempotency-Key"
          in: "header"
          description: "Optional. A repeat with the same key and body returns the original response (header \u0060Idempotency-Replayed: true\u0060) and creates nothing new; the same key with a different body is 422; a repeat while the first is running is 409. Keys are remembered for 24 hours."
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/membership/applications/check:
    post:
      tags:
        - "Membership"
      summary: "Warn when an email or phone already applied"
      description: "Warn-only: re-applying (for example after a rejection) is legitimate, so a duplicate never blocks a submission. Rate limited at the gateway."
      operationId: "CheckMembershipDuplicate"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicateCheckRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/membership/applications/status:
    post:
      tags:
        - "Membership"
      summary: "Look up an application\u0027s status"
      description: "Needs the reference AND the email used to apply. Any mismatch returns the same 404. Returns status transitions only. Rate limited at the gateway."
      operationId: "LookupMembershipStatus"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusLookupRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/membership/campaigns/current:
    get:
      tags:
        - "Membership"
      summary: "Is recruitment open, and which season"
      description: "\u0060intake\u0060 is \u0060open\u0060 (inside a season), \u0060closed\u0060 (seasons exist but none is open; applications get 409 INTAKE_CLOSED) or \u0060unrestricted\u0060 (no season is defined)."
      operationId: "GetCurrentCampaign"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/membership/campaigns:
    get:
      tags:
        - "Membership admin"
      summary: "List recruitment campaigns"
      operationId: "ListCampaigns"
      responses:
        "200":
          description: "OK"
    post:
      tags:
        - "Membership admin"
      summary: "Create a recruitment campaign"
      operationId: "CreateCampaign"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignRequest"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/membership/campaigns/{id}":
    put:
      tags:
        - "Membership admin"
      summary: "Change a campaign\u0027s name or window"
      operationId: "UpdateCampaign"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignRequest"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/membership/campaigns/{id}/close":
    post:
      tags:
        - "Membership admin"
      summary: "Close a campaign now"
      description: "Intake stops immediately: applications get 409 INTAKE_CLOSED unless another season is open. Closing twice changes nothing."
      operationId: "CloseCampaign"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/membership/applications:
    get:
      tags:
        - "Membership admin"
      summary: "List applications for review"
      description: "Internal view with notes, score, reviewer and full status history. Filters: status, campaignId; paging: limit (default 200, max 500), offset."
      operationId: "ListMembershipApplications"
      parameters:
        -
          name: "status"
          in: "query"
          schema:
            type: "string"
        -
          name: "campaignId"
          in: "query"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/membership/applications/{id}":
    get:
      tags:
        - "Membership admin"
      summary: "One application with notes and history"
      operationId: "GetMembershipApplication"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
    patch:
      tags:
        - "Membership admin"
      summary: "Assign a reviewer, set the score or the interview time"
      description: "Body fields are optional: \u0060reviewerId\u0060, \u0060score\u0060 (0-100), \u0060interviewAt\u0060. Send null to clear one."
      operationId: "UpdateMembershipApplication"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonElement"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/membership/applications/{id}/notes":
    post:
      tags:
        - "Membership admin"
      summary: "Add an internal reviewer note"
      operationId: "AddMembershipNote"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/admin/membership/applications/transition:
    post:
      tags:
        - "Membership admin"
      summary: "Move applications to a new status, in bulk"
      description: "Up to 200 ids. Always 200 with one result per id; a failed item carries \u0060error\u0060 (\u0060not_found\u0060, \u0060final\u0060, \u0060invalid_transition\u0060, \u0060interview_date_required\u0060) and changes nothing. Each success is audited, appended to the history and queues the applicant\u0027s notification in their language. \u0060interview_scheduled\u0060 needs \u0060interviewAt\u0060."
      operationId: "TransitionMembershipApplications"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/admin/membership/profile-changes:
    get:
      tags:
        - "Membership admin"
      summary: "Sensitive profile edits waiting for review (status=pending|approved|rejected)"
      operationId: "ListProfileChanges"
      parameters:
        -
          name: "status"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/membership/profile-changes/{id}/approve":
    post:
      tags:
        - "Membership admin"
      summary: "Apply a member\u0027s sensitive edit"
      operationId: "ApproveProfileChange"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/membership/profile-changes/{id}/reject":
    post:
      tags:
        - "Membership admin"
      summary: "Refuse a member\u0027s sensitive edit, with a reason the member can read"
      operationId: "RejectProfileChange"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/members/me/profile:
    get:
      tags:
        - "Member portal"
      summary: "The member\u0027s profile, with moderation status of pending edits"
      operationId: "GetMyProfile"
      responses:
        "200":
          description: "OK"
    patch:
      tags:
        - "Member portal"
      summary: "Edit the profile: phone, address and expertise apply now; names, date of birth and blood group wait for review"
      operationId: "UpdateMyProfile"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePatch"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/members/me/consents:
    get:
      tags:
        - "Member portal"
      summary: "What the member has agreed to publish (everything off until they say so)"
      operationId: "GetMyConsents"
      responses:
        "200":
          description: "OK"
    put:
      tags:
        - "Member portal"
      summary: "Give or withdraw publication consent per field"
      operationId: "SetMyConsents"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Consents"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/members/me/notifications:
    get:
      tags:
        - "Member portal"
      summary: "Which messages the member wants"
      operationId: "GetMyNotifications"
      responses:
        "200":
          description: "OK"
    put:
      tags:
        - "Member portal"
      summary: "Choose which messages to receive"
      operationId: "SetMyNotifications"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPrefs"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/members/me/deletion-request:
    post:
      tags:
        - "Member portal"
      summary: "Ask for the member\u0027s data to be erased"
      description: "Records the request and returns 202 with a reference; repeating it returns the same one. Carrying it out, and what must be kept by law, is decided with the retention work (#58)."
      operationId: "RequestMyDeletion"
      responses:
        "200":
          description: "OK"
  /api/v1/members/me/photo:
    put:
      tags:
        - "Member portal"
      summary: "Set the member\u0027s photo (jpeg, png or webp, up to 2 MB)"
      operationId: "UploadMyPhoto"
      responses:
        "200":
          description: "OK"
    get:
      tags:
        - "Member portal"
      summary: "The member\u0027s own photo"
      operationId: "GetMyPhoto"
      responses:
        "200":
          description: "OK"
    delete:
      tags:
        - "Member portal"
      summary: "Remove the member\u0027s photo"
      operationId: "DeleteMyPhoto"
      responses:
        "200":
          description: "OK"
  /api/v1/members/me/export:
    get:
      tags:
        - "Member portal"
      summary: "Download everything held about the member"
      description: "Profile, consents and their history, edit requests, the original application with its history and reviewer notes, messages sent, audit entries about the member\u0027s records, and the Identity account with sessions. Secrets (password hashes, token values) are never included. \u0060identityAvailable\u0060 is false when Identity could not be reached; retry for the full set."
      operationId: "ExportMyData"
      responses:
        "200":
          description: "OK"
  /api/v1/members/me/card:
    get:
      tags:
        - "Member portal"
      summary: "Membership card data with its QR code (SVG)"
      operationId: "GetMyCard"
      responses:
        "200":
          description: "OK"
  /api/v1/members/me/card.pdf:
    get:
      tags:
        - "Member portal"
      summary: "Membership card as a printable PDF (Bengali name rendered with an embedded font)"
      operationId: "GetMyCardPdf"
      responses:
        "200":
          description: "OK"
  /api/v1/members/directory:
    get:
      tags:
        - "Directory"
      summary: "Public member directory"
      description: "Only members who opted in appear. \u0060chapter\u0060 filters to current members of a chapter committee (by its English name) who agreed to be named; \u0060chapters\u0060 lists the chapters, each with only the fields they approved (name, photo, expertise). Contact details are never offered. 24 per page, page 1-50, \u0060q\u0060 matches only published fields. Never cached; rate limited at the gateway."
      operationId: "SearchMemberDirectory"
      parameters:
        -
          name: "q"
          in: "query"
          schema:
            type: "string"
        -
          name: "chapter"
          in: "query"
          schema:
            type: "string"
        -
          name: "page"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  "/api/v1/members/directory/{id}/photo":
    get:
      tags:
        - "Directory"
      summary: "A consented, scanned member photo"
      operationId: "GetDirectoryPhoto"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/membership/members:
    get:
      tags:
        - "Membership admin"
      summary: "Search members (staff)"
      description: "Name, member code and expertise search with status filter; paged (limit max 100). Contact details are not part of the list: open one member for those."
      operationId: "ListMembers"
      parameters:
        -
          name: "q"
          in: "query"
          schema:
            type: "string"
        -
          name: "status"
          in: "query"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/membership/members/{id}":
    get:
      tags:
        - "Membership admin"
      summary: "One member with contact details (staff)"
      operationId: "GetMember"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/membership/committees:
    get:
      tags:
        - "Membership admin"
      summary: "All committees, flat (the client nests them by parentId); archived ones with includeArchived=true"
      operationId: "ListCommittees"
      parameters:
        -
          name: "includeArchived"
          in: "query"
          schema:
            type: "boolean"
      responses:
        "200":
          description: "OK"
    post:
      tags:
        - "Membership admin"
      summary: "Create a committee, chapter or project group"
      operationId: "CreateCommittee"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitteeRequest"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/membership/committees/{id}":
    put:
      tags:
        - "Membership admin"
      summary: "Rename, re-parent or change the kind of a committee"
      operationId: "UpdateCommittee"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitteeRequest"
        required: true
      responses:
        "200":
          description: "OK"
    delete:
      tags:
        - "Membership admin"
      summary: "Delete a committee that never had members or children"
      operationId: "DeleteCommittee"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/membership/committees/{id}/archive":
    post:
      tags:
        - "Membership admin"
      summary: "Retire a committee: it leaves the public chart, its history stays"
      operationId: "ArchiveCommittee"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/membership/committees/{id}/unarchive":
    post:
      tags:
        - "Membership admin"
      summary: "Bring an archived committee back"
      operationId: "UnarchiveCommittee"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/membership/committees/{id}/members":
    get:
      tags:
        - "Membership admin"
      summary: "A committee\u0027s terms: scope=current|past|all (default all)"
      operationId: "ListCommitteeTerms"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "scope"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
    post:
      tags:
        - "Membership admin"
      summary: "Seat a member in a position for a term"
      operationId: "AddCommitteeTerm"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermRequest"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/membership/committees/{id}/members/{termId}":
    put:
      tags:
        - "Membership admin"
      summary: "Correct a term\u0027s position or dates"
      operationId: "UpdateCommitteeTerm"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "termId"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermRequest"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/membership/committees/{id}/members/{termId}/end":
    post:
      tags:
        - "Membership admin"
      summary: "End a term (default today); the term stays as history"
      operationId: "EndCommitteeTerm"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "termId"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndTermRequest"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/membership/members/{id}/lifecycle":
    get:
      tags:
        - "Membership admin"
      summary: "A member\u0027s status history and tenure"
      description: "Termination reasons are returned only to callers with \u0060membership.terminate\u0060; others see \u0060reasonRestricted: true\u0060. Tenure is the time spent active, summed over every stretch of service."
      operationId: "GetMemberLifecycle"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/membership/members/{id}/status":
    post:
      tags:
        - "Membership admin"
      summary: "Move a member to on_leave, inactive, alumni, terminated or back to active"
      description: "Allowed moves: active to on_leave/inactive/alumni/terminated; on_leave and inactive back to active or on to alumni/terminated; alumni to active/terminated; terminated to active. \u0060effectiveOn\u0060 defaults to today and may not be in the future or before the previous change. \u0060reason\u0060 is required to terminate and is readable only with \u0060membership.terminate\u0060. Terminating or reinstating needs that permission and switches the Identity login off or on; ending service (alumni, inactive, terminated) ends the member\u0027s open committee terms; terminating withdraws all publication consent. Reactivation restores nothing automatically: the member opts in again."
      operationId: "ChangeMemberStatus"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusChangeRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/membership/privacy:
    get:
      tags:
        - "Privacy"
      summary: "What the platform actually does with personal data"
      description: "The configured notice version, data location and retention windows, so the published privacy statement can state exactly what runs. A null window means that kind of data is not purged automatically."
      operationId: "GetPrivacyBehaviour"
      responses:
        "200":
          description: "OK"
  /api/v1/membership/applications/export:
    post:
      tags:
        - "Privacy"
      summary: "An applicant\u0027s own data (reference and email required)"
      description: "Same two factors as the status lookup; any mismatch is the same 404. Rate limited at the gateway."
      operationId: "ExportApplicationData"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataRequestInput"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/membership/applications/erasure-request:
    post:
      tags:
        - "Privacy"
      summary: "Ask for an application to be erased (reference and email required)"
      description: "Records the request and returns 202 with a reference; staff carry it out, so nobody can delete someone else\u0027s application by knowing an email. Repeating returns the same reference."
      operationId: "RequestApplicationErasure"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataRequestInput"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/admin/membership/retention/run:
    post:
      tags:
        - "Privacy admin"
      summary: "Find (dryRun=true, the default) or purge (dryRun=false) applications past their retention window"
      description: "Windows come from \u0060Privacy:*ApplicationMonths\u0060; a status with no window is never touched. Every run, dry or not, is recorded with the policy used; a purge also records the opaque ids it removed, never anything personal."
      operationId: "RunRetention"
      parameters:
        -
          name: "dryRun"
          in: "query"
          schema:
            type: "boolean"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/membership/retention/runs:
    get:
      tags:
        - "Privacy admin"
      summary: "Past retention runs"
      operationId: "ListRetentionRuns"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/membership/retention/runs/{id}/items":
    get:
      tags:
        - "Privacy admin"
      summary: "What a run purged: opaque ids, status and the day the status began"
      operationId: "ListRetentionRunItems"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/membership/erasure-requests:
    get:
      tags:
        - "Privacy admin"
      summary: "Erasure requests (status=pending, the default, or completed)"
      operationId: "ListErasureRequests"
      parameters:
        -
          name: "status"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/membership/erasure-requests/{id}/execute":
    post:
      tags:
        - "Privacy admin"
      summary: "Carry out an erasure request"
      description: "Members: the Identity account is erased first, then in one transaction the application (with files, notes and queued messages), edit requests and profile are removed or blanked, committee terms end, consents are withdrawn and a non-identifying erasure record is written; the actor\u0027s email/IP on their audit rows is nulled. Applicants: the application and its files are deleted. Idempotent on Identity, so a failed run can be repeated; a completed request is 409."
      operationId: "ExecuteErasure"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/committees:
    get:
      tags:
        - "Committees"
      summary: "The organisation\u0027s committees as a tree, with current members who agreed to be named"
      description: "Current terms only (dates inclusive), members who consented to publish their name. Never cached: withdrawing consent shows on the next request."
      operationId: "GetOrgChart"
      responses:
        "200":
          description: "OK"
  "/api/v1/committees/{slug}":
    get:
      tags:
        - "Committees"
      summary: "One committee with its current and past members (consenting members only)"
      operationId: "GetCommittee"
      parameters:
        -
          name: "slug"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/membership/audit:
    get:
      tags:
        - "Admin \u2014 Audit log"
      summary: "Query the Membership audit log"
      description: "Newest first. Filters: \u0060actor\u0060 (id or email), \u0060entity\u0060, \u0060entityId\u0060, \u0060action\u0060 (create/update/delete), \u0060requestId\u0060, \u0060from\u0060, \u0060to\u0060. Page with \u0060cursor\u0060 = the \u0060nextCursor\u0060 of the previous page. Requires \u0060audit.view\u0060; before/after hold personal data."
      operationId: "ListMembershipAuditLog"
      parameters:
        -
          name: "actor"
          in: "query"
          schema:
            type: "string"
        -
          name: "entity"
          in: "query"
          schema:
            type: "string"
        -
          name: "entityId"
          in: "query"
          schema:
            type: "string"
        -
          name: "action"
          in: "query"
          schema:
            type: "string"
        -
          name: "requestId"
          in: "query"
          schema:
            type: "string"
        -
          name: "from"
          in: "query"
          schema:
            type: "string"
            format: "date-time"
        -
          name: "to"
          in: "query"
          schema:
            type: "string"
            format: "date-time"
        -
          name: "cursor"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int64"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/membership/audit/{id}":
    get:
      tags:
        - "Admin \u2014 Audit log"
      summary: "Get one Membership audit event"
      operationId: "GetMembershipAuditEvent"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
  "/api/v1/membership/applications/{id}/attachments/{kind}":
    put:
      tags:
        - "Membership"
      summary: "Attach a CV or photo to an application"
      description: "Raw file body with the file\u0027s Content-Type and an optional URL-encoded X-Filename header. cv: pdf/doc/docx up to 5 MB; photo: jpeg/png/webp up to 2 MB. The content is checked against the declared type. A second upload replaces the first. Files are stored with scanStatus \u0060pending\u0060 until the media pipeline scans them."
      operationId: "UploadMembershipAttachment"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "kind"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/donations/presets:
    get:
      tags:
        - "Donations"
      summary: "Suggested amounts and limits per currency"
      description: "Amounts are decimal strings. Currency rules come from configuration, so they can change without a frontend release."
      operationId: "GetDonationPresets"
      responses:
        "200":
          description: "OK"
  /api/v1/donations:
    post:
      tags:
        - "Donations"
      summary: "Start a donation"
      description: "Records the intent as \u0060pending\u0060 and starts a hosted checkout: the response carries \u0060gateway\u0060 and \u0060checkoutUrl\u0060 to send the donor to. Pass \u0060gateway\u0060 (bkash, nagad, sslcommerz) to choose one; otherwise the first enabled gateway that supports the currency is used. When no checkout can be started (no gateway switched on, or it is down) the donation is still recorded and the response has \u0060fallback: offline\u0060 instead. A return from the gateway never confirms payment. Amounts are decimal strings with at most two decimals and must sit inside the currency\u0027s limits (see presets). With \u0060coverFees\u0060 the response carries \u0060fee\u0060 and \u0060total\u0060, and \u0060amount\u0060 stays the designated gift. A \u0060monthly\u0060 or \u0060yearly\u0060 frequency also creates a recurring plan. Anonymous gifts are never attributed in any public response."
      operationId: "CreateDonation"
      parameters:
        -
          name: "Idempotency-Key"
          in: "header"
          description: "Optional. A repeat with the same key and body returns the original response (header \u0060Idempotency-Replayed: true\u0060) and creates nothing new; the same key with a different body is 422; a repeat while the first is running is 409. Keys are remembered for 24 hours."
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonationRequest"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/donations/{reference}/status":
    get:
      tags:
        - "Donations"
      summary: "The outcome of one donation, by its public reference"
      description: "Never cached. Returns the reference, status, designated amount, currency, the gateway used (when one was) and the anonymous flag, and nothing about the donor."
      operationId: "GetDonationStatus"
      parameters:
        -
          name: "reference"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/donations/{reference}/receipt.pdf":
    get:
      tags:
        - "Donations"
      summary: "The donor\u0027s receipt as a bilingual PDF"
      description: "Available once the donation is confirmed, and gone (404) if it is reversed. The unguessable reference is the access key, as for the status page. Never cached."
      operationId: "GetDonationReceiptPdf"
      parameters:
        -
          name: "reference"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/donations/{reference}/return":
    get:
      tags:
        - "Donations"
      summary: "Where a payment gateway sends the donor back to"
      description: "Accepts \u0060?result=success|fail|cancel\u0060 and answers \u0060303\u0060 to the site\u0027s \u0060/{lang}/donate/status?ref=\u0026gateway=\u0026result=return|cancel\u0060. It never changes a donation: only the signed webhook confirms payment."
      operationId: "DonationGatewayReturnGet"
      parameters:
        -
          name: "reference"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "result"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
    post:
      tags:
        - "Donations"
      summary: "Where a payment gateway sends the donor back to"
      description: "Accepts \u0060?result=success|fail|cancel\u0060 and answers \u0060303\u0060 to the site\u0027s \u0060/{lang}/donate/status?ref=\u0026gateway=\u0026result=return|cancel\u0060. It never changes a donation: only the signed webhook confirms payment."
      operationId: "DonationGatewayReturnPost"
      parameters:
        -
          name: "reference"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "result"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/donations:
    get:
      tags:
        - "Finance"
      summary: "Donations and their reversing entries, newest first"
      description: "Filters: from/to (UTC dates, inclusive), method (the gateway), status (pending, confirmed, failed, cancelled, refunded), designation (\u0060general\u0060, \u0060campaign:slug\u0060, \u0060project:slug\u0060). Amounts are decimal strings; reversals are negative. Donor names are shown to finance staff even for anonymous gifts, flagged by \u0060anonymous\u0060."
      operationId: "ListFinanceDonations"
      parameters:
        -
          name: "from"
          in: "query"
          schema:
            type: "string"
        -
          name: "to"
          in: "query"
          schema:
            type: "string"
        -
          name: "status"
          in: "query"
          schema:
            type: "string"
        -
          name: "method"
          in: "query"
          schema:
            type: "string"
        -
          name: "designation"
          in: "query"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
    post:
      tags:
        - "Offline donations"
      summary: "Record a gift that arrived offline"
      description: "\u0060{donorName, email?, phone?, amount, currency, method, date?, designation?, anonymous?, dedication?, referenceNo?, note?, valuation?}\u0060 with \u0060method\u0060 one of bank, cash, cheque, bkash, nagad, in_kind. The donation is created \u0060pending\u0060 and posts nothing until a different user approves it. \u0060date\u0060 is when it arrived (not in the future). An in_kind gift needs \u0060valuation: {basis, itemDescription, note?}\u0060 (basis market_price, appraisal, donor_receipt, cost or other; a note is required for other), and its amount is the valuation. Requires \u0060finance.donation.record\u0060."
      operationId: "RecordOfflineDonation"
      parameters:
        -
          name: "Idempotency-Key"
          in: "header"
          description: "Optional. A repeat with the same key and body returns the original response (header \u0060Idempotency-Replayed: true\u0060) and creates nothing new; the same key with a different body is 422; a repeat while the first is running is 409. Keys are remembered for 24 hours."
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfflineDonationRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/donations/totals:
    get:
      tags:
        - "Finance"
      summary: "Confirmed and pending totals per currency"
      description: "One entry per currency, never converted. Confirmed is net of reversals (reversing entries are negative); count includes every entry."
      operationId: "GetFinanceDonationTotals"
      parameters:
        -
          name: "designation"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/donations/{id}":
    get:
      tags:
        - "Finance"
      summary: "One donation with donor contact details, events and its reversal"
      operationId: "GetFinanceDonation"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/donations/{id}/reversal":
    post:
      tags:
        - "Finance"
      summary: "Post a reversing entry for a confirmed donation"
      description: "The original is never changed: a new entry with negated amount and fee is appended, the donation\u0027s ledger posting is reversed in the same commit, and the original reads as \u0060refunded\u0060. A donation can be reversed once, and not when the month the reversal would land in is closed (\u0060PERIOD_CLOSED\u0060). Requires \u0060finance.donation.reverse\u0060."
      operationId: "ReverseFinanceDonation"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReversalRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/recurring-plans:
    get:
      tags:
        - "Finance"
      summary: "Recurring donation plans, newest first"
      operationId: "ListRecurringPlans"
      parameters:
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/donations/{id}/proofs":
    put:
      tags:
        - "Offline donations"
      summary: "Attach a proof document"
      description: "Raw file body with its Content-Type (pdf, jpeg, png, webp, up to 5 MB, checked against the file\u0027s own bytes) and an optional URL-encoded \u0060X-Filename\u0060. Up to ten per donation, only while it awaits a decision. A proof is a financial record: nothing can delete it, and it is kept for the configured retention period. Requires \u0060finance.donation.record\u0060."
      operationId: "AddOfflineDonationProof"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/donations/{id}/offline":
    get:
      tags:
        - "Offline donations"
      summary: "The offline record, its proofs and its decision"
      operationId: "GetOfflineDonation"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/donations/{id}/proofs/{proofId}/file":
    get:
      tags:
        - "Offline donations"
      summary: "Download a proof document"
      description: "Served as an attachment, never cached. Requires \u0060finance.view\u0060."
      operationId: "DownloadOfflineDonationProof"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "proofId"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/donations/{id}/approve":
    post:
      tags:
        - "Offline donations"
      summary: "Approve an offline donation: confirms it and posts it to the ledger"
      description: "Only a user other than the recorder may approve (403 SEPARATION_OF_DUTIES). A bank, cheque or wallet gift needs at least one proof (409 PROOF_REQUIRED). The gift posts to the ledger dated the day it arrived, or today if that month is closed. Approving again is harmless. Requires \u0060finance.donation.approve\u0060."
      operationId: "ApproveOfflineDonation"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/donations/{id}/reject":
    post:
      tags:
        - "Offline donations"
      summary: "Reject an offline donation: it is cancelled and posts nothing"
      description: "A reason of 3-500 characters is required. A mistaken record is rejected and recorded again; records are never edited. Requires \u0060finance.donation.approve\u0060."
      operationId: "RejectOfflineDonation"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/receipts:
    get:
      tags:
        - "Receipts"
      summary: "Receipts, newest number first"
      description: "Filters: series (fiscal year such as 2026-27), status (valid, void)."
      operationId: "ListReceipts"
      parameters:
        -
          name: "series"
          in: "query"
          schema:
            type: "string"
        -
          name: "status"
          in: "query"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/receipts/verify:
    get:
      tags:
        - "Receipts"
      summary: "Check a series for gaps, broken links and altered receipts"
      description: "Walks the fiscal year\u0027s receipts in order: the sequence must run 1..n without gaps, each receipt must carry the previous one\u0027s hash, and each hash must match the receipt\u0027s own content. \u0060valid\u0060 is false and \u0060problems\u0060 says where when not."
      operationId: "VerifyReceiptSeries"
      parameters:
        -
          name: "series"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/receipts/{id}":
    get:
      tags:
        - "Receipts"
      summary: "One receipt with its hash links, void and re-issue history"
      operationId: "GetReceipt"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/receipts/{id}/pdf":
    get:
      tags:
        - "Receipts"
      summary: "The receipt as a bilingual PDF"
      description: "Marked VOID when its donation was reversed, and as a DUPLICATE COPY once re-issued. Requires \u0060finance.view\u0060."
      operationId: "GetReceiptPdf"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/receipts/{id}/reissue":
    post:
      tags:
        - "Receipts"
      summary: "Issue a copy of a receipt again"
      description: "The original is untouched and keeps its number; the re-issue is recorded with who asked and why, and later PDFs are marked DUPLICATE COPY n. \u0060resend: true\u0060 also queues the email again. A void receipt cannot be re-issued. Requires \u0060finance.receipt.manage\u0060."
      operationId: "ReissueReceipt"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReissueRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/statements:
    get:
      tags:
        - "Statements"
      summary: "Per-donor annual totals for a fiscal year"
      description: "Donors are grouped by a keyed hash of their email. Voided receipts are left out; each currency is totalled separately, with in-kind value apart from money. A donor with no email stands alone per gift."
      operationId: "ListDonorStatements"
      parameters:
        -
          name: "fiscalYear"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/statements/{donorKey}/pdf":
    get:
      tags:
        - "Statements"
      summary: "A donor\u0027s annual statement as a bilingual PDF"
      operationId: "GetDonorStatementPdf"
      parameters:
        -
          name: "donorKey"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "fiscalYear"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/statements/send:
    post:
      tags:
        - "Statements"
      summary: "Queue each donor\u0027s annual statement for email, once per donor and year"
      description: "Writes one outbox message per donor with an email address who has not been queued for that fiscal year; a repeat queues nothing new. Requires \u0060finance.receipt.manage\u0060."
      operationId: "QueueDonorStatements"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementSendRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/donors:
    get:
      tags:
        - "Donors"
      summary: "Donors with lifetime giving and segments"
      description: "Only non-anonymous gifts with an email build a donor: an anonymous gift leaves no attributable record. Giving is derived from valid receipts, so it always matches the books. Filters: segment (recurring, major, new, lapsed), asOf (yyyy-MM-dd; segments are re-run as of that date), q (name or email)."
      operationId: "ListDonors"
      parameters:
        -
          name: "segment"
          in: "query"
          schema:
            type: "string"
        -
          name: "asOf"
          in: "query"
          schema:
            type: "string"
        -
          name: "q"
          in: "query"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/donors/{id}":
    get:
      tags:
        - "Donors"
      summary: "One donor with contact, consent and its history, and every gift"
      operationId: "GetDonor"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "asOf"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/donors/{id}/donations":
    get:
      tags:
        - "Donors"
      summary: "A donor\u0027s confirmed, unreversed gifts, newest first"
      operationId: "ListDonorDonations"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/donors/{id}/consent":
    post:
      tags:
        - "Donors"
      summary: "Record a donor granting or withdrawing consent for one purpose"
      description: "Purposes: thanks, updates, appeals. Source is \u0060admin\u0060 (default) or \u0060donor_request\u0060 (the donor asked us to); the donation form\u0027s own consent is recorded automatically and cannot be set here. Append-only; the latest entry per purpose is the donor\u0027s current consent. Requires \u0060finance.donor.manage\u0060."
      operationId: "ChangeDonorConsent"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/donors/messages:
    post:
      tags:
        - "Donors"
      summary: "Queue an appeal or update to a segment, through the consent gate"
      description: "Template \u0060donor.appeal\u0060 needs each donor\u0027s \u0060appeals\u0060 consent and \u0060donor.update\u0060 their \u0060updates\u0060 consent; donors without it are suppressed (and the suppression is recorded), never written to. Requires \u0060finance.donor.manage\u0060."
      operationId: "QueueDonorMessages"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonorMessageRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/donors/export:
    get:
      tags:
        - "Donors"
      summary: "Export a segment as CSV"
      description: "The same donors and the same rules as the list, for the same \u0060asOf\u0060 date, so an export can be reproduced. \u0060consent=appeals\u0060 (or thanks, updates) keeps only donors who granted that purpose. Cells that could run as spreadsheet formulas are neutralised. Every export is logged with who, what and how many. Requires \u0060finance.donor.export\u0060."
      operationId: "ExportDonors"
      parameters:
        -
          name: "segment"
          in: "query"
          schema:
            type: "string"
        -
          name: "asOf"
          in: "query"
          schema:
            type: "string"
        -
          name: "consent"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/donors/reconciliation:
    get:
      tags:
        - "Donors"
      summary: "Compare each donor\u0027s giving with the ledger"
      description: "For every donor and currency: the sum of valid receipts against the net donation income the ledger holds for the same donations (reversals netted). \u0060reconciled\u0060 is true when every difference is zero. Anonymous gifts are in neither side."
      operationId: "ReconcileDonors"
      responses:
        "200":
          description: "OK"
  "/api/v1/campaigns/{slug}/progress":
    get:
      tags:
        - "Campaigns"
      summary: "A campaign\u0027s public progress"
      description: "\u0060raised\u0060 is a decimal string in the campaign\u0027s own \u0060currency\u0060 and counts only confirmed, un-reversed gifts in that currency; gifts in other currencies are listed in \u0060otherCurrencies\u0060 and are never converted into it. The figure is computed at most once per \u0060cacheSeconds\u0060 however many requests arrive, carries an ETag and Cache-Control, and answers 503 rather than a stale-beyond-limit number. 404 for an unknown or draft campaign."
      operationId: "GetCampaignProgress"
      parameters:
        -
          name: "slug"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/campaigns:
    get:
      tags:
        - "Campaigns"
      summary: "Campaigns with what each has raised"
      description: "Figures are computed live from receipts, not from the public cache."
      operationId: "ListFundraisingCampaigns"
      parameters:
        -
          name: "status"
          in: "query"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
    post:
      tags:
        - "Campaigns"
      summary: "Create a campaign"
      description: "\u0060{title, titleBn?, slug?, goal, currency, status?, startsOn?, endsOn?}\u0060; \u0060goal\u0060 is a positive decimal string. The slug (default: made from the title) is the public identifier and never changes. New campaigns are drafts unless \u0060status\u0060 says otherwise. Requires \u0060finance.campaign.manage\u0060."
      operationId: "CreateFundraisingCampaign"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FundraisingCampaignRequest"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/campaigns/{id}":
    put:
      tags:
        - "Campaigns"
      summary: "Edit a campaign\u0027s title, goal, dates or status"
      description: "Same body as create. The slug cannot change (409 SLUG_LOCKED) and neither can the currency once gifts are designated to the campaign (409 CURRENCY_LOCKED). The public figure is refreshed at once. Requires \u0060finance.campaign.manage\u0060."
      operationId: "UpdateFundraisingCampaign"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FundraisingCampaignRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/campaigns/reconciliation:
    get:
      tags:
        - "Campaigns"
      summary: "Compare each campaign\u0027s receipts with the ledger and with the public cache"
      description: "Per campaign and currency: the receipts\u0027 total, the net designated-donation income in the ledger, their difference (zero when the books agree), and what the public cache currently holds for the campaign\u0027s own currency (it can lag by up to the cache interval, and never exceeds the receipts)."
      operationId: "ReconcileFundraisingCampaigns"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/expenses:
    post:
      tags:
        - "Expenses"
      summary: "Submit an expense"
      description: "\u0060{payee, description, category, amount, currency, project?, date?, reimbursement?}\u0060. \u0060category\u0060 is one of the configured keys (programme, fundraising, administrative, events, other); \u0060project\u0060 is an optional project slug for rollups; \u0060reimbursement: true\u0060 means the money is owed to the person who paid out of pocket. How many different people must approve is fixed now from the amount tier. Attach receipts with \u0060PUT .../{id}/receipts\u0060. Requires \u0060finance.expense.submit\u0060."
      operationId: "SubmitExpense"
      parameters:
        -
          name: "Idempotency-Key"
          in: "header"
          description: "Optional. A repeat with the same key and body returns the original response (header \u0060Idempotency-Replayed: true\u0060) and creates nothing new; the same key with a different body is 422; a repeat while the first is running is 409. Keys are remembered for 24 hours."
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseRequest"
        required: true
      responses:
        "200":
          description: "OK"
    get:
      tags:
        - "Expenses"
      summary: "Expenses, newest first"
      description: "\u0060status\u0060 is pending (no final decision yet, including part-approved), approved or rejected; \u0060approvals\u0060 of \u0060requiredApprovals\u0060 shows progress and \u0060paid\u0060 whether the money has gone out. Filters: status, project, category."
      operationId: "ListExpenses"
      parameters:
        -
          name: "status"
          in: "query"
          schema:
            type: "string"
        -
          name: "project"
          in: "query"
          schema:
            type: "string"
        -
          name: "category"
          in: "query"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/expenses/{id}":
    get:
      tags:
        - "Expenses"
      summary: "One expense with approvals, receipts, payment and its ledger posting"
      operationId: "GetExpense"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/expenses/{id}/receipts":
    put:
      tags:
        - "Expenses"
      summary: "Attach a receipt"
      description: "Raw file body with its Content-Type (pdf, jpeg, png, webp, up to 5 MB, checked against the file\u0027s own bytes) and an optional URL-encoded \u0060X-Filename\u0060; up to ten, only before the expense is decided. A receipt is a financial record: nothing can delete it. Requires \u0060finance.expense.submit\u0060."
      operationId: "AddExpenseReceipt"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/expenses/{id}/receipts/{receiptId}/file":
    get:
      tags:
        - "Expenses"
      summary: "Download a receipt"
      operationId: "DownloadExpenseReceipt"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "receiptId"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/expenses/{id}/approve":
    post:
      tags:
        - "Expenses"
      summary: "Add your approval"
      description: "The submitter cannot approve (403 SEPARATION_OF_DUTIES), nobody approves twice, and a receipt must be attached first (409 RECEIPT_REQUIRED). The expense becomes \u0060approved\u0060, and posts to the ledger (Dr the category\u0027s expense account, Cr payables), when the number of different approvers its amount tier requires has approved. Requires \u0060finance.expense.approve\u0060."
      operationId: "ApproveExpense"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "Idempotency-Key"
          in: "header"
          description: "Optional. A repeat with the same key and body returns the original response (header \u0060Idempotency-Replayed: true\u0060) and creates nothing new; the same key with a different body is 422; a repeat while the first is running is 409. Keys are remembered for 24 hours."
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseDecisionRequest"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/expenses/{id}/reject":
    post:
      tags:
        - "Expenses"
      summary: "Reject an expense"
      description: "One rejection ends it, with a note of 3-500 characters; nothing is posted. The submitter cannot decide their own expense. A rejected expense is submitted again, not edited. Requires \u0060finance.expense.approve\u0060."
      operationId: "RejectExpense"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "Idempotency-Key"
          in: "header"
          description: "Optional. A repeat with the same key and body returns the original response (header \u0060Idempotency-Replayed: true\u0060) and creates nothing new; the same key with a different body is 422; a repeat while the first is running is 409. Keys are remembered for 24 hours."
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseDecisionRequest"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/expenses/{id}/pay":
    post:
      tags:
        - "Expenses"
      summary: "Record that an approved expense was paid"
      description: "\u0060{method: bank|cash|cheque|bkash|nagad, reference?, paidOn?}\u0060. Only an approved expense can be paid, once, and not by its submitter. Posts Dr payable (2020 for a reimbursement, 2100 for a vendor) / Cr the cash, bank or wallet account. Requires \u0060finance.expense.pay\u0060."
      operationId: "PayExpense"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpensePayRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/expenses/rollups:
    get:
      tags:
        - "Expenses"
      summary: "Approved spend by project and by category"
      description: "Approved expenses only, per currency (never added together), with how much of it has been paid. Optional \u0060from\u0060/\u0060to\u0060 filter on the date the expense was incurred."
      operationId: "GetExpenseRollups"
      parameters:
        -
          name: "from"
          in: "query"
          schema:
            type: "string"
        -
          name: "to"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/expenses/rollups/reconciliation:
    get:
      tags:
        - "Expenses"
      summary: "Compare approved spend per project and category with the ledger"
      description: "For each project and category and currency: approved expenses against the net debit the ledger holds on expense accounts for the same expenses (reversals netted). Every difference is zero when the books agree."
      operationId: "ReconcileExpenseRollups"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/fiscal-years:
    get:
      tags:
        - "Budgets"
      summary: "Fiscal years that have postings, budgets or a close, and the current one"
      description: "A year is open until it is closed. Labels and dates follow the ledger\u0027s fiscal calendar (\u0060Finance:Ledger:FiscalYearStartMonth\u0060, July by default: \u00602026-27\u0060 runs 2026-07-01 to 2027-06-30)."
      operationId: "ListFiscalYears"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/fiscal-years/{label}/close":
    post:
      tags:
        - "Budgets"
      summary: "Close a fiscal year"
      description: "Only a year that has ended can be closed, once. Afterwards the ledger rejects any posting or reversal dated in it (\u0060FISCAL_YEAR_CLOSED\u0060, 409) and its budgets are frozen. There is no reopen in this version. Requires \u0060finance.period.close\u0060."
      operationId: "CloseFiscalYear"
      parameters:
        -
          name: "label"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/budgets:
    get:
      tags:
        - "Budgets"
      summary: "Budget lines for a fiscal year with actual spend from the ledger"
      description: "\u0060year\u0060 defaults to the current fiscal year. \u0060actual\u0060 is read from the ledger: debits less credits on the category\u0027s expense account in the line\u0027s currency, dated inside the year; a project line counts only spend from expenses coded to that project. \u0060status\u0060 is ok, warning (past the first alert threshold) or over (actual above plan)."
      operationId: "ListBudgets"
      parameters:
        -
          name: "year"
          in: "query"
          schema:
            type: "string"
        -
          name: "currency"
          in: "query"
          schema:
            type: "string"
        -
          name: "project"
          in: "query"
          schema:
            type: "string"
        -
          name: "category"
          in: "query"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
    post:
      tags:
        - "Budgets"
      summary: "Add a budget line"
      description: "\u0060{year?, category, project?, planned, currency}\u0060: \u0060year\u0060 defaults to the current fiscal year, \u0060category\u0060 is an expense category key, \u0060project\u0060 (a slug) narrows it to one project and omitting it budgets the whole organisation for that category, \u0060planned\u0060 is a positive decimal string. One line per year, currency, project and category. A closed year takes no new lines. Requires \u0060finance.budget.manage\u0060."
      operationId: "CreateBudget"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetRequest"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/budgets/{id}":
    put:
      tags:
        - "Budgets"
      summary: "Change a budget line\u0027s planned amount"
      description: "Only the amount can change; the year, currency, project and category identify the line. Audited. Refused once the year is closed. Requires \u0060finance.budget.manage\u0060."
      operationId: "UpdateBudget"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetChange"
        required: true
      responses:
        "200":
          description: "OK"
    delete:
      tags:
        - "Budgets"
      summary: "Remove a budget line from an open year"
      description: "A budget is a plan, so it can be removed while its year is open; the removal is audited and alerts already fired stay on record. Requires \u0060finance.budget.manage\u0060."
      operationId: "DeleteBudget"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/budgets/alerts:
    get:
      tags:
        - "Budgets"
      summary: "Over-budget alerts that have fired, newest first"
      operationId: "ListBudgetAlerts"
      parameters:
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/budgets/alerts/run:
    post:
      tags:
        - "Budgets"
      summary: "Check every open budget line against the alert thresholds now"
      description: "Fires, once per line and threshold, an alert for each configured percentage (default 80 and 100) of the plan that spend has reached; the same check runs on a timer. Requires \u0060finance.budget.manage\u0060."
      operationId: "RunBudgetAlerts"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/bank-accounts:
    get:
      tags:
        - "Banking"
      summary: "Bank accounts with the number masked to its last four digits"
      operationId: "ListBankAccounts"
      parameters:
        -
          name: "includeArchived"
          in: "query"
          schema:
            type: "boolean"
      responses:
        "200":
          description: "OK"
    post:
      tags:
        - "Banking"
      summary: "Register a bank account"
      description: "\u0060{name, bankName, number, currency, ledgerAccount?, csvMapping?}\u0060. The number is stored encrypted and shown masked; \u0060ledgerAccount\u0060 is the asset account of the ledger that holds this bank\u0027s balance (default 1020) and may be used by one live bank account only. \u0060csvMapping\u0060 names the statement\u0027s columns (\u0060date\u0060, \u0060description\u0060, \u0060reference\u0060, \u0060amount\u0060 or \u0060debit\u0060\u002B\u0060credit\u0060, \u0060balance\u0060, \u0060dateFormat\u0060, \u0060delimiter\u0060); without it the header row is detected. Requires \u0060finance.bank.manage\u0060."
      operationId: "CreateBankAccount"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankAccountRequest"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/bank-accounts/{id}":
    patch:
      tags:
        - "Banking"
      summary: "Rename, re-map or archive a bank account"
      description: "Any of \u0060name\u0060, \u0060bankName\u0060, \u0060csvMapping\u0060 (or \u0060clearCsvMapping\u0060), \u0060archived\u0060, and \u0060ledgerAccount\u0060 (only before the first statement is imported). The number cannot be changed: register a new account. Requires \u0060finance.bank.manage\u0060."
      operationId: "UpdateBankAccount"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankAccountChange"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/bank-accounts/{id}/number":
    get:
      tags:
        - "Banking"
      summary: "The full account number (logged)"
      description: "Every read is recorded with who read it. Requires \u0060finance.bank.reveal\u0060, which only Admin holds by default."
      operationId: "RevealBankAccountNumber"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/bank-accounts/{id}/statements":
    post:
      tags:
        - "Banking"
      summary: "Import a CSV or OFX statement"
      description: "Send the file as the request body (\u0060?format=csv|ofx\u0060, detected if omitted; \u0060X-Filename\u0060 is recorded). All or nothing: if any row cannot be read the response is 422 \u0060IMPORT_REJECTED\u0060 with \u0060errors:[{row, reason}]\u0060 for every bad row and nothing is stored. Lines already imported from an earlier statement are not stored again and are listed under \u0060duplicates\u0060. The same file cannot be imported twice (409). Unambiguous lines are matched to ledger entries automatically. Requires \u0060finance.reconcile\u0060."
      operationId: "ImportBankStatement"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "format"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
    get:
      tags:
        - "Banking"
      summary: "Statements imported for a bank account, newest first"
      operationId: "ListBankStatements"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/bank-accounts/{id}/rematch":
    post:
      tags:
        - "Banking"
      summary: "Run automatic matching again for an account"
      description: "Useful after new ledger entries were posted. Same rules as at import. Requires \u0060finance.reconcile\u0060."
      operationId: "RematchBankLines"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/bank-accounts/{id}/summary":
    get:
      tags:
        - "Banking"
      summary: "Ledger balance against the statement, with what is still unexplained"
      description: "\u0060ledgerBalance\u0060 of the mapped ledger account, \u0060bankBalance\u0060 (the running balance on the newest statement line, when the file has one), counts and net of unmatched lines and entries, and \u0060unexplained\u0060: the bank balance less unmatched and dismissed lines, less the ledger balance less unmatched entries. It is zero when every difference is itemised in the queue."
      operationId: "GetBankReconciliationSummary"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/reconciliation:
    get:
      tags:
        - "Banking"
      summary: "Statement lines and the ledger entries they can be matched with"
      description: "\u0060lines\u0060 are statement lines (unmatched first, then newest first; \u0060amount\u0060 is signed, money in positive) with \u0060status\u0060 unmatched, matched or dismissed and \u0060matchedEntryId\u0060; \u0060entries\u0060 are the unmatched ledger entries on the bank accounts\u0027 ledger accounts plus the ones the listed lines are matched to. Filters: \u0060account\u0060, \u0060status\u0060, \u0060limit\u0060."
      operationId: "GetReconciliation"
      parameters:
        -
          name: "account"
          in: "query"
          schema:
            type: "string"
        -
          name: "status"
          in: "query"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/reconciliation/match:
    post:
      tags:
        - "Banking"
      summary: "Match a statement line to a ledger entry"
      description: "\u0060{lineId, entryId}\u0060. The entry must be on the bank account\u0027s ledger account, on the matching side (money in is a debit, out a credit), for exactly the line\u0027s amount and currency, and not matched to another line. Requires \u0060finance.reconcile\u0060."
      operationId: "MatchBankLine"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/reconciliation/unmatch:
    post:
      tags:
        - "Banking"
      summary: "Undo a match"
      description: "\u0060{lineId}\u0060. Only a match is undone; a posting made by post-and-match stays in the ledger (reverse it from the ledger if it was wrong). A dismissed line is reopened with its own endpoint. Requires \u0060finance.reconcile\u0060."
      operationId: "UnmatchBankLine"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnmatchRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/reconciliation/dismiss:
    post:
      tags:
        - "Banking"
      summary: "Set a line aside with a reason"
      description: "\u0060{lineId, reason}\u0060 (3 to 500 characters), for a line that needs no ledger entry. Requires \u0060finance.reconcile\u0060."
      operationId: "DismissBankLine"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DismissRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/reconciliation/reopen:
    post:
      tags:
        - "Banking"
      summary: "Put a dismissed line back in the queue"
      operationId: "ReopenBankLine"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnmatchRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/reconciliation/post-and-match:
    post:
      tags:
        - "Banking"
      summary: "Post the missing ledger entry for a line and match it"
      description: "\u0060{lineId, account, memo?}\u0060: posts a balanced entry between the bank account\u0027s ledger account and \u0060account\u0060 (a ledger account code), dated the line\u0027s date, then matches the bank side to the line. Money in debits the bank account, money out credits it. It follows the ledger\u0027s rules (no future date, no closed period) and cannot post twice for one line. Requires \u0060finance.ledger.adjust\u0060."
      operationId: "PostAndMatchBankLine"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostAndMatchRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/reports:
    get:
      tags:
        - "Reports"
      summary: "Generated monthly report packs, newest first"
      description: "Each item is \u0060{id, month, generatedAt, url}\u0060 (plus who made it, its SHA-256 and size). \u0060url\u0060 is an absolute link to the stored workbook that is valid for a few minutes (\u0060Finance:Reports:LinkMinutes\u0060); list again for a fresh one."
      operationId: "ListReportPacks"
      parameters:
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
    post:
      tags:
        - "Reports"
      summary: "Generate and store a month\u0027s financial report pack"
      description: "\u0060{month: \u00222026-03\u0022}\u0060. Builds one workbook from the ledger (summary with the reconciliation checks, trial balance, income statement, balance sheet, cash flow, donations, project costs, donors, donation and expense registers, general ledger), stores it and returns \u0060{id, month, generatedAt, url}\u0060. The stored file never changes; generating again makes a new pack. Requires \u0060finance.report.generate\u0060."
      operationId: "GenerateReportPack"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateReportRequest"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/finance/report-downloads/{id}":
    get:
      tags:
        - "Reports"
      summary: "Download a stored report pack with its signed link"
      description: "Needs no bearer token (a browser link cannot send one); the short-lived \u0060token\u0060 from the list or generate response is the credential. The file\u0027s hash is checked before it is served."
      operationId: "DownloadReportPack"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "token"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/reports/{name}":
    get:
      tags:
        - "Reports"
      summary: "A financial report as JSON, CSV or XLSX"
      description: "\u0060name\u0060: income-statement, balance-sheet, cash-flow, donations, project-costs, donors, trial-balance, general-ledger, donation-register, expense-register or auditor-pack (every sheet). Query: \u0060from\u0060, \u0060to\u0060 (default: this month), \u0060asOf\u0060 (balances, default \u0060to\u0060), \u0060currency\u0060, \u0060format\u0060 (json default; csv is UTF-8 with a byte-order mark so Excel reads Bengali, a zip of CSVs for the auditor pack; xlsx). Amounts are decimal strings in JSON and never converted between currencies. Statements are per currency and carry reconciliation \u0060checks\u0060. Requires \u0060finance.view\u0060."
      operationId: "GetFinancialReport"
      parameters:
        -
          name: "name"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "from"
          in: "query"
          schema:
            type: "string"
        -
          name: "to"
          in: "query"
          schema:
            type: "string"
        -
          name: "asOf"
          in: "query"
          schema:
            type: "string"
        -
          name: "currency"
          in: "query"
          schema:
            type: "string"
        -
          name: "format"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/ledger:
    get:
      tags:
        - "Ledger"
      summary: "Ledger lines, newest first"
      description: "One row per posting line. Filters: from/to (posting dates, inclusive), account (code). \u0060reversalOf\u0060 / \u0060reversedBy\u0060 link a posting to its correction. Read-only: there is no way to change a line."
      operationId: "ListLedgerEntries"
      parameters:
        -
          name: "from"
          in: "query"
          schema:
            type: "string"
        -
          name: "to"
          in: "query"
          schema:
            type: "string"
        -
          name: "account"
          in: "query"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/ledger/postings/{id}":
    get:
      tags:
        - "Ledger"
      summary: "One posting with all its lines"
      operationId: "GetLedgerPosting"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/ledger/postings:
    post:
      tags:
        - "Ledger"
      summary: "Post a manual adjustment"
      description: "A balanced posting by hand: at least two lines, each with an account code, exactly one of \u0060debit\u0060 or \u0060credit\u0060 (decimal strings) and a currency; debits must equal credits in every currency. A \u0060reason\u0060 is required. The date defaults to today and may not be in the future or in a closed period. Requires \u0060finance.ledger.adjust\u0060."
      operationId: "PostLedgerAdjustment"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentRequest"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/ledger/postings/{id}/reversal":
    post:
      tags:
        - "Ledger"
      summary: "Reverse a posting"
      description: "Appends a posting that mirrors the original with debits and credits swapped, dated today and linked to it. The original is untouched. A posting can be reversed once; a reversal cannot be reversed. Requires \u0060finance.ledger.adjust\u0060."
      operationId: "ReverseLedgerPosting"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type: "integer"
            format: "int64"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostingReversalRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/ledger/trial-balance:
    get:
      tags:
        - "Ledger"
      summary: "Trial balance per currency"
      description: "Debits and credits per account up to \u0060asOf\u0060 (default today), one section per currency, never converted. \u0060balanced\u0060 is true when total debits equal total credits, which every posting guarantees."
      operationId: "GetTrialBalance"
      parameters:
        -
          name: "asOf"
          in: "query"
          schema:
            type: "string"
        -
          name: "currency"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/ledger/accounts:
    get:
      tags:
        - "Ledger"
      summary: "The chart of accounts"
      operationId: "ListLedgerAccounts"
      responses:
        "200":
          description: "OK"
    post:
      tags:
        - "Ledger"
      summary: "Add an account to the chart"
      description: "Codes are 1-16 letters, digits, dots or dashes and unique; the type (asset, liability, equity, income, expense) cannot be changed later. Requires \u0060finance.ledger.adjust\u0060."
      operationId: "CreateLedgerAccount"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRequest"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/ledger/accounts/{id}/archive":
    post:
      tags:
        - "Ledger"
      summary: "Archive an account: no new postings, history kept"
      description: "Seeded (system) accounts cannot be archived. Requires \u0060finance.ledger.adjust\u0060."
      operationId: "ArchiveLedgerAccount"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/ledger/periods:
    get:
      tags:
        - "Ledger"
      summary: "Months that have postings or are closed"
      operationId: "ListLedgerPeriods"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/ledger/periods/{period}/close":
    post:
      tags:
        - "Ledger"
      summary: "Close a month"
      description: "A closed month rejects new postings and reversals dated in it, and there is no reopen in this version. Only a past or current month can be closed. Requires \u0060finance.period.close\u0060."
      operationId: "CloseLedgerPeriod"
      parameters:
        -
          name: "period"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/donations/webhooks/{gateway}":
    get:
      tags:
        - "Donations"
      summary: "Payment gateway webhook or browser callback"
      description: "Called by the gateways, not by the site. The call is a prompt to look, never proof: the signature is checked where the gateway signs (unsigned or badly signed calls get 400 and are logged), then the gateway itself is asked what happened, and only its answer confirms or fails the donation. A repeated delivery changes nothing. POST answers 200, 400 or 503 (deliver again); GET, the donor returning, answers 303 to the site\u0027s status page."
      operationId: "PaymentWebhookGet"
      parameters:
        -
          name: "gateway"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
    post:
      tags:
        - "Donations"
      summary: "Payment gateway webhook or browser callback"
      description: "Called by the gateways, not by the site. The call is a prompt to look, never proof: the signature is checked where the gateway signs (unsigned or badly signed calls get 400 and are logged), then the gateway itself is asked what happened, and only its answer confirms or fails the donation. A repeated delivery changes nothing. POST answers 200, 400 or 503 (deliver again); GET, the donor returning, answers 303 to the site\u0027s status page."
      operationId: "PaymentWebhookPost"
      parameters:
        -
          name: "gateway"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/webhook-rejections:
    get:
      tags:
        - "Reconciliation"
      summary: "Refused gateway calls, newest first"
      description: "The alert list: unsigned or badly signed webhooks, calls about unknown payments, and paid amounts that did not match the donation. Reason codes: BAD_SIGNATURE, UNKNOWN_GATEWAY, GATEWAY_DISABLED, UNKNOWN_PAYMENT, REFERENCE_MISMATCH, AMOUNT_MISMATCH."
      operationId: "ListWebhookRejections"
      parameters:
        -
          name: "gateway"
          in: "query"
          schema:
            type: "string"
        -
          name: "reason"
          in: "query"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/provider-notices:
    get:
      tags:
        - "Reconciliation"
      summary: "Refunds and disputes the gateways reported, newest first"
      description: "Signed refund and dispute messages from Stripe and PayPal. They change nothing by themselves: finance reviews each and, where money went back, reverses the donation with the reversal endpoint (the full refund and dispute workflow is BE-068). Filters: gateway, kind (refund, dispute)."
      operationId: "ListProviderNotices"
      parameters:
        -
          name: "gateway"
          in: "query"
          schema:
            type: "string"
        -
          name: "kind"
          in: "query"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/reconciliation/pending/run:
    post:
      tags:
        - "Reconciliation"
      summary: "Ask the gateways about checkouts still pending"
      description: "Asks each gateway about every donation still pending after \u0060ReconcileAfterMinutes\u0060 and applies the answer exactly as a webhook would. A gateway that does not answer leaves the donation pending. The same job also runs on a timer. Requires \u0060finance.reconcile\u0060."
      operationId: "ResolvePendingPayments"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/payouts:
    post:
      tags:
        - "Reconciliation"
      summary: "Import a gateway settlement and match it to donations"
      description: "\u0060{gateway, payoutRef, paidOn?, lines:[{reference, gross, fee, net, currency}]}\u0060, amounts as decimal strings with \u0060gross = fee \u002B net\u0060. Each line is matched (donation confirmed, not reversed, same gateway, not already settled, gross equal to the charge), unmatched, amount_mismatch or duplicate. Matched lines post the settlement to the ledger; the whole batch is written together or not at all. A payout can be imported once. Requires \u0060finance.reconcile\u0060."
      operationId: "ImportGatewayPayout"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutImport"
        required: true
      responses:
        "200":
          description: "OK"
    get:
      tags:
        - "Reconciliation"
      summary: "Imported payouts with their line matches"
      operationId: "ListGatewayPayouts"
      parameters:
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/payouts/{id}":
    get:
      tags:
        - "Reconciliation"
      summary: "One payout with its lines"
      operationId: "GetGatewayPayout"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/reconciliation/unpaid:
    get:
      tags:
        - "Reconciliation"
      summary: "Confirmed gateway donations not yet settled by an imported payout"
      operationId: "ListUnpaidGatewayDonations"
      parameters:
        -
          name: "gateway"
          in: "query"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/finance/audit:
    get:
      tags:
        - "Admin \u2014 Audit log"
      summary: "Query the Finance audit log"
      description: "Newest first. Filters: \u0060actor\u0060 (id or email), \u0060entity\u0060, \u0060entityId\u0060, \u0060action\u0060 (create/update/delete), \u0060requestId\u0060, \u0060from\u0060, \u0060to\u0060. Page with \u0060cursor\u0060 = the \u0060nextCursor\u0060 of the previous page. Requires \u0060audit.view\u0060; before/after hold personal data."
      operationId: "ListFinanceAuditLog"
      parameters:
        -
          name: "actor"
          in: "query"
          schema:
            type: "string"
        -
          name: "entity"
          in: "query"
          schema:
            type: "string"
        -
          name: "entityId"
          in: "query"
          schema:
            type: "string"
        -
          name: "action"
          in: "query"
          schema:
            type: "string"
        -
          name: "requestId"
          in: "query"
          schema:
            type: "string"
        -
          name: "from"
          in: "query"
          schema:
            type: "string"
            format: "date-time"
        -
          name: "to"
          in: "query"
          schema:
            type: "string"
            format: "date-time"
        -
          name: "cursor"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int64"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/finance/audit/{id}":
    get:
      tags:
        - "Admin \u2014 Audit log"
      summary: "Get one Finance audit event"
      operationId: "GetFinanceAuditEvent"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
  /api/v1/auth/register:
    post:
      tags:
        - "Auth"
      summary: "Register a new user account"
      description: "Creates a new member account with a hashed password and sends an email-confirmation message. The requested role is ignored: new accounts are \u0060Member\u0060. Includes optional legacy profile fields (name, gender, address, etc.)."
      operationId: "Register"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyRegistrationRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/auth/login:
    post:
      tags:
        - "Auth"
      summary: "Login and receive tokens"
      description: "Authenticates a user and returns an \u0060access_token\u0060 (RS256 JWT, 15 min) and a \u0060refresh_token\u0060 (opaque, stored hashed, 30 days). Repeated failures lock the account (423). Unconfirmed emails are rejected (403) unless \u0060Identity:RequireConfirmedEmail\u0060 is off."
      operationId: "Login"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/auth/refresh:
    post:
      tags:
        - "Auth"
      summary: "Refresh an expired access token"
      description: "Rotates the refresh token and issues a new access token. The old refresh token is single-use; presenting it again ends the whole session."
      operationId: "RefreshToken"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/auth/logout:
    post:
      tags:
        - "Auth"
      summary: "Logout and revoke refresh token"
      description: "Ends the session the given refresh token belongs to. Returns 204 No Content on success."
      operationId: "Logout"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/auth/confirm-email:
    post:
      tags:
        - "Auth"
      summary: "Confirm an email address"
      description: "Confirms the address using the token from the confirmation email. Returns 204 on success."
      operationId: "ConfirmEmail"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmEmailRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/auth/resend-confirmation:
    post:
      tags:
        - "Auth"
      summary: "Resend the confirmation email"
      description: "Always returns 202, whether or not the account exists."
      operationId: "ResendConfirmation"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendConfirmationRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/auth/forgot-password:
    post:
      tags:
        - "Auth"
      summary: "Request a password-reset email"
      description: "Always returns 202, whether or not the account exists, so it cannot be used to discover accounts."
      operationId: "ForgotPassword"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/auth/reset-password:
    post:
      tags:
        - "Auth"
      summary: "Set a new password with a reset token"
      description: "Sets the password using the emailed token, lifts any lockout and revokes all refresh tokens. Returns 204 on success."
      operationId: "ResetPassword"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/auth/me:
    get:
      tags:
        - "Auth"
      summary: "Get the authenticated user\u0027s profile"
      description: "Returns the full profile of the currently authenticated user. Requires \u0060Authorization: Bearer \u003Caccess_token\u003E\u0060 obtained from the login endpoint."
      operationId: "GetCurrentUser"
      responses:
        "200":
          description: "OK"
  /.well-known/jwks.json:
    get:
      tags:
        - "System"
      summary: "Public signing keys"
      description: "The public keys that verify access tokens (JSON Web Key Set). Contains no secrets."
      operationId: "Jwks"
      responses:
        "200":
          description: "OK"
  /api/v1/auth/sessions:
    get:
      tags:
        - "Auth"
      summary: "List the signed-in user\u0027s active sessions"
      description: "One entry per device/session with a live refresh token. \u0060current\u0060 marks the session making the request."
      operationId: "ListSessions"
      responses:
        "200":
          description: "OK"
  "/api/v1/auth/sessions/{id}":
    delete:
      tags:
        - "Auth"
      summary: "End one of the user\u0027s sessions"
      description: "Revokes the session\u0027s refresh tokens. Another user\u0027s session id is reported as not found."
      operationId: "RevokeSession"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/auth/logout-all:
    post:
      tags:
        - "Auth"
      summary: "End every session of the signed-in user"
      description: "Revokes all refresh tokens for the user, on every device. Returns 204."
      operationId: "LogoutAll"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/auth/permissions:
    get:
      tags:
        - "Admin \u2014 Roles and users"
      summary: "List every permission key, grouped by module"
      operationId: "ListPermissions"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/auth/roles:
    get:
      tags:
        - "Admin \u2014 Roles and users"
      summary: "List roles with their permissions and member counts"
      operationId: "ListRoles"
      responses:
        "200":
          description: "OK"
    post:
      tags:
        - "Admin \u2014 Roles and users"
      summary: "Create a role"
      description: "You can only grant permissions you hold yourself. Changes are logged with before/after."
      operationId: "CreateRole"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/auth/roles/{name}":
    get:
      tags:
        - "Admin \u2014 Roles and users"
      summary: "Get a role"
      operationId: "GetRole"
      parameters:
        -
          name: "name"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
    delete:
      tags:
        - "Admin \u2014 Roles and users"
      summary: "Delete a custom role"
      description: "Built-in roles and \u0060SuperAdmin\u0060 cannot be deleted, nor can a role that still has members."
      operationId: "DeleteRole"
      parameters:
        -
          name: "name"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/auth/roles/{name}/permissions":
    put:
      tags:
        - "Admin \u2014 Roles and users"
      summary: "Replace the permissions of a role"
      description: "\u0060SuperAdmin\u0060 cannot be changed (409 SUPERADMIN_PROTECTED). Members\u0027 sessions end so the new permissions apply at their next sign-in."
      operationId: "SetRolePermissions"
      parameters:
        -
          name: "name"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPermissionsRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/admin/auth/users:
    get:
      tags:
        - "Admin \u2014 Roles and users"
      summary: "List users with their roles"
      operationId: "ListUsers"
      parameters:
        -
          name: "role"
          in: "query"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/auth/users/{id}/roles":
    put:
      tags:
        - "Admin \u2014 Roles and users"
      summary: "Replace the roles of a user"
      description: "Granting a role needs every permission the role holds. Only a SuperAdmin can grant or remove \u0060SuperAdmin\u0060, and the last active SuperAdmin cannot be removed (409 LAST_SUPERADMIN). The user\u0027s sessions end."
      operationId: "SetUserRoles"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserRolesRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/admin/auth/members:
    post:
      tags:
        - "Admin \u2014 Roles and users"
      summary: "Create the login for an approved membership application"
      description: "Creates a password-less, email-confirmed Member account with the applicant\u0027s profile and returns a one-time setup token. Idempotent per \u0060applicationId\u0060: a repeat returns the same account with a fresh token. 409 EMAIL_TAKEN when another account already uses the email."
      operationId: "ProvisionMember"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionMemberRequest"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/auth/members/{userId}/erase":
    post:
      tags:
        - "Admin \u2014 Roles and users"
      summary: "Erase a member\u0027s login and profile"
      description: "Replaces the email and user name with a placeholder, removes the password, profile, roles and sessions, and nulls the actor email/IP/browser on the account\u0027s audit rows. The row and its id remain. Idempotent. Only accounts made by approving an application are accepted."
      operationId: "EraseMemberAccount"
      parameters:
        -
          name: "userId"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/auth/members/{userId}/status":
    put:
      tags:
        - "Admin \u2014 Roles and users"
      summary: "Disable or re-enable a member\u0027s login"
      description: "Disabling blocks sign-in and refresh at once and ends every session. Only accounts created by approving an application are accepted."
      operationId: "SetMemberAccountStatus"
      parameters:
        -
          name: "userId"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberAccountStatusRequest"
        required: true
      responses:
        "200":
          description: "OK"
  /api/v1/members/me/sessions:
    get:
      tags:
        - "Member portal"
      summary: "The member\u0027s signed-in devices"
      operationId: "ListMemberSessions"
      responses:
        "200":
          description: "OK"
  "/api/v1/members/me/sessions/{id}":
    delete:
      tags:
        - "Member portal"
      summary: "Sign one device out"
      operationId: "RevokeMemberSession"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/auth/me/export:
    get:
      tags:
        - "Auth"
      summary: "Everything Identity holds about the signed-in user"
      description: "Account, profile, active sessions and audit entries about or by the caller. Never includes password hashes or token values. Used by the member data export."
      operationId: "ExportMyAccount"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/auth/audit:
    get:
      tags:
        - "Admin \u2014 Audit log"
      summary: "Query the Auth audit log"
      description: "Newest first. Filters: \u0060actor\u0060 (id or email), \u0060entity\u0060, \u0060entityId\u0060, \u0060action\u0060 (create/update/delete), \u0060requestId\u0060, \u0060from\u0060, \u0060to\u0060. Page with \u0060cursor\u0060 = the \u0060nextCursor\u0060 of the previous page. Requires \u0060audit.view\u0060; before/after hold personal data."
      operationId: "ListAuthAuditLog"
      parameters:
        -
          name: "actor"
          in: "query"
          schema:
            type: "string"
        -
          name: "entity"
          in: "query"
          schema:
            type: "string"
        -
          name: "entityId"
          in: "query"
          schema:
            type: "string"
        -
          name: "action"
          in: "query"
          schema:
            type: "string"
        -
          name: "requestId"
          in: "query"
          schema:
            type: "string"
        -
          name: "from"
          in: "query"
          schema:
            type: "string"
            format: "date-time"
        -
          name: "to"
          in: "query"
          schema:
            type: "string"
            format: "date-time"
        -
          name: "cursor"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int64"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/auth/audit/{id}":
    get:
      tags:
        - "Admin \u2014 Audit log"
      summary: "Get one Auth audit event"
      operationId: "GetAuthAuditEvent"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
