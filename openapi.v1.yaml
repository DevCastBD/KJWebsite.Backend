            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    patch:
      tags:
        - "Admin \u2014 CTA"
      summary: "Update status, assignee or notes"
      description: "Omitted fields are unchanged; an empty assigneeId or notes clears it. Requires \u0060cta.manage\u0060; every change is audited."
      operationId: "UpdateCtaSubmission"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionPatchRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionPatchResult"
        "400":
          description: "Validation failed. \u0060errors\u0060 lists each field."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: "Authentication is required."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: "The caller lacks the required permission."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: "Not found."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/register:
    post:
      tags:
        - "Auth"
      summary: "Register a new user account"
      description: "Creates a new member account with a hashed password and sends an email-confirmation message. The requested role is ignored: new accounts are \u0060Member\u0060. Includes optional legacy profile fields (name, gender, address, etc.)."
      operationId: "Register"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyRegistrationRequest"
        required: true
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredUser"
        "429":
          description: "Too Many Requests"
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "400":
          description: "Validation failed. \u0060errors\u0060 lists each field."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/login:
    post:
      tags:
        - "Auth"
      summary: "Login and receive tokens"
      description: "Authenticates a user and returns an \u0060access_token\u0060 (RS256 JWT, 15 min) and a \u0060refresh_token\u0060 (opaque, stored hashed, 30 days). Repeated failures lock the account (423). Unconfirmed emails are rejected (403) unless \u0060Identity:RequireConfirmedEmail\u0060 is off."
      operationId: "Login"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "429":
          description: "Too Many Requests"
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: "Unauthorized"
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: "Forbidden"
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "423":
          description: "Locked"
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "400":
          description: "Validation failed. \u0060errors\u0060 lists each field."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/refresh:
    post:
      tags:
        - "Auth"
      summary: "Refresh an expired access token"
      description: "Rotates the refresh token and issues a new access token. The old refresh token is single-use; presenting it again ends the whole session."
      operationId: "RefreshToken"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          description: "Unauthorized"
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "400":
          description: "Validation failed. \u0060errors\u0060 lists each field."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/logout:
    post:
      tags:
        - "Auth"
      summary: "Logout and revoke refresh token"
      description: "Ends the session the given refresh token belongs to. Returns 204 No Content on success."
      operationId: "Logout"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "204":
          description: "No Content"
        "400":
          description: "Validation failed. \u0060errors\u0060 lists each field."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/confirm-email:
    post:
      tags:
        - "Auth"
      summary: "Confirm an email address"
      description: "Confirms the address using the token from the confirmation email. Returns 204 on success."
      operationId: "ConfirmEmail"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmEmailRequest"
        required: true
      responses:
        "204":
          description: "No Content"
        "400":
          description: "Validation failed. \u0060errors\u0060 lists each field."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/resend-confirmation:
    post:
      tags:
        - "Auth"
      summary: "Resend the confirmation email"
      description: "Always returns 202, whether or not the account exists."
      operationId: "ResendConfirmation"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendConfirmationRequest"
        required: true
      responses:
        "202":
          description: "Accepted"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: "Validation failed. \u0060errors\u0060 lists each field."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/forgot-password:
    post:
      tags:
        - "Auth"
      summary: "Request a password-reset email"
      description: "Always returns 202, whether or not the account exists, so it cannot be used to discover accounts."
      operationId: "ForgotPassword"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
        required: true
      responses:
        "202":
          description: "Accepted"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: "Validation failed. \u0060errors\u0060 lists each field."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/reset-password:
    post:
      tags:
        - "Auth"
      summary: "Set a new password with a reset token"
      description: "Sets the password using the emailed token, lifts any lockout and revokes all refresh tokens. Returns 204 on success."
      operationId: "ResetPassword"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "204":
          description: "No Content"
        "400":
          description: "Validation failed. \u0060errors\u0060 lists each field."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/me:
    get:
      tags:
        - "Auth"
      summary: "Get the authenticated user\u0027s profile"
      description: "Returns the full profile of the currently authenticated user. Requires \u0060Authorization: Bearer \u003Caccess_token\u003E\u0060 obtained from the login endpoint."
      operationId: "GetCurrentUser"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: "Authentication is required."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: "The caller lacks the required permission."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /.well-known/jwks.json:
    get:
      tags:
        - "System"
      summary: "Public signing keys"
      description: "The public keys that verify access tokens (JSON Web Key Set). Contains no secrets."
      operationId: "Jwks"
      responses:
        "200":
          description: "OK"
  /api/v1/auth/sessions:
    get:
      tags:
        - "Auth"
      summary: "List the signed-in user\u0027s active sessions"
      description: "One entry per device/session with a live refresh token. \u0060current\u0060 marks the session making the request."
      operationId: "ListSessions"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          description: "Authentication is required."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: "The caller lacks the required permission."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  "/api/v1/auth/sessions/{id}":
    delete:
      tags:
        - "Auth"
      summary: "End one of the user\u0027s sessions"
      description: "Revokes the session\u0027s refresh tokens. Another user\u0027s session id is reported as not found."
      operationId: "RevokeSession"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "204":
          description: "No Content"
        "401":
          description: "Authentication is required."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: "The caller lacks the required permission."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: "Not found."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/logout-all:
    post:
      tags:
        - "Auth"
      summary: "End every session of the signed-in user"
      description: "Revokes all refresh tokens for the user, on every device. Returns 204."
      operationId: "LogoutAll"
      responses:
        "204":
          description: "No Content"
        "400":
          description: "Validation failed. \u0060errors\u0060 lists each field."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: "Authentication is required."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: "The caller lacks the required permission."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
