openapi: "3.1.1"
info:
  title: "KJWebsite Backend API"
  version: "1.0.0"
  description: "Public and admin API contract for KJWebsite microservices via API Gateway. Generated from the development service OpenAPI documents."
servers:
  -
    url: "http://localhost:7000"
    description: "Local API Gateway"
paths:
  /health:
    get:
      tags:
        - "System"
      summary: "Gateway health check"
      operationId: "GatewayHealth"
      responses:
        "200":
          description: "OK"
  /api/v1/content/projects:
    get:
      tags:
        - "Content"
      summary: "List projects (paginated)"
      description: "Returns \u0060{ items, total, limit, offset, lang }\u0060. \u0060lang\u0060: en/bn (default en). \u0060status\u0060: active/all (default active). \u0060limit\u0060: 1\u2013100 (default 20). \u0060offset\u0060: default 0. ETag \u002B Cache-Control are set."
      operationId: "GetProjects"
      parameters:
        -
          name: "lang"
          in: "query"
          schema:
            type: "string"
        -
          name: "status"
          in: "query"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  "/api/v1/content/projects/{id}":
    get:
      tags:
        - "Content"
      summary: "Get project by ID"
      description: "Returns a single project by slug ID in the requested language (\u0060lang\u0060: en/bn, default en)."
      operationId: "GetProjectById"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "lang"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/content/news:
    get:
      tags:
        - "Content"
      summary: "List news articles (paginated)"
      description: "Returns \u0060{ items, total, limit, offset, lang }\u0060. \u0060lang\u0060: en/bn (default en). \u0060limit\u0060: 1\u2013100 (default 20). \u0060offset\u0060: default 0. ETag \u002B Cache-Control are set."
      operationId: "GetNews"
      parameters:
        -
          name: "lang"
          in: "query"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
  "/api/v1/content/news/{id}":
    get:
      tags:
        - "Content"
      summary: "Get news article by ID"
      description: "Returns a single news article by slug ID in the requested language (\u0060lang\u0060: en/bn, default en)."
      operationId: "GetNewsById"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "lang"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/content/bootstrap:
    get:
      tags:
        - "Content"
      summary: "Cold-start bundle"
      description: "Returns \u0060{ projects, news, settings, lang }\u0060 in one call for the SPA\u0027s first render (up to 100 active projects and 100 news items). ETag \u002B Cache-Control are set."
      operationId: "GetContentBootstrap"
      parameters:
        -
          name: "lang"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/content/projects:
    get:
      tags:
        - "Admin \u2014 Content"
      summary: "List projects with all translations"
      description: "Returns every translation of every project, grouped per slug. Requires the matching \u0060content.*\u0060 permission."
      operationId: "ListAdminProjects"
      parameters:
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
    post:
      tags:
        - "Admin \u2014 Content"
      summary: "Create or replace a project"
      description: "Creates a project with all provided language translations. Replaces (or restores) any existing project with the same slug. Requires the matching \u0060content.*\u0060 permission."
      operationId: "CreateProject"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpsertRequest"
        required: true
      responses:
        "200":
          description: "OK"
  "/api/v1/admin/content/projects/{id}":
    get:
      tags:
        - "Admin \u2014 Content"
      summary: "Get a project with all translations"
      description: "Requires the \u0060content.view\u0060 permission. The \u0060ETag\u0060 header is the version to send back as \u0060If-Match\u0060 on update."
      operationId: "GetAdminProject"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
    put:
      tags:
        - "Admin \u2014 Content"
      summary: "Update a project"
      description: "Replaces all translations for the given project. Requires the matching \u0060content.*\u0060 permission. Send the \u0060ETag\u0060 from the last read as \u0060If-Match\u0060: if the item changed since, the response is 409 CONFLICT and nothing is saved. Without \u0060If-Match\u0060 the last write wins."
      operationId: "UpdateProject"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpsertRequest"
        required: true
      responses:
        "200":
          description: "OK"
    delete:
      tags:
        - "Admin \u2014 Content"
      summary: "Delete a project"
      description: "Soft-deletes the project (the slug stays reserved). Requires the matching \u0060content.*\u0060 permission."
      operationId: "DeleteProject"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
  /api/v1/admin/content/news:
    get:
      tags:
        - "Admin \u2014 Content"
      summary: "List news articles with all translations"
      description: "Returns every translation of every article, grouped per slug. Requires the matching \u0060content.*\u0060 permission."
