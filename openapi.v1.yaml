        "404":
          description: "Not found."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/content/bootstrap:
    get:
      tags:
        - "Content"
      summary: "Cold-start bundle"
      description: "Returns \u0060{ projects, news, settings, lang }\u0060 in one call for the SPA\u0027s first render (up to 100 active projects and 100 news items). ETag \u002B Cache-Control are set."
      operationId: "GetContentBootstrap"
      parameters:
        -
          name: "lang"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentBootstrap"
        "304":
          description: "Not Modified"
        "400":
          description: "Validation failed. \u0060errors\u0060 lists each field."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/admin/content/projects:
    get:
      tags:
        - "Admin \u2014 Content"
      summary: "List projects with all translations"
      description: "Returns every translation of every project, grouped per slug. Requires the matching \u0060content.*\u0060 permission."
      operationId: "ListAdminProjects"
      parameters:
        -
          name: "limit"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
        -
          name: "offset"
          in: "query"
          schema:
            pattern: "^-?(?:0|[1-9]\\d*)$"
            type:
              - "integer"
              - "string"
            format: "int32"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagingEnvelopeOfProjectAdminView"
        "400":
          description: "Validation failed. \u0060errors\u0060 lists each field."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: "Authentication is required."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: "The caller lacks the required permission."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    post:
      tags:
        - "Admin \u2014 Content"
      summary: "Create or replace a project"
      description: "Creates a project with all provided language translations. Replaces (or restores) any existing project with the same slug. Requires the matching \u0060content.*\u0060 permission."
      operationId: "CreateProject"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpsertRequest"
        required: true
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectItem"
        "400":
          description: "Validation failed. \u0060errors\u0060 lists each field."
          content:
            "application/problem\u002Bjson":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: "Authentication is required."
          content:
            "application/problem\u002Bjson":
